<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Deliberately partial, and it must stay that way.

      There is NO `default-src`, and no `script-src` or `style-src`. Every
      one of those falls back to `default-src`, and a srcdoc iframe inherits
      the parent document's CSP — so restricting scripts here would block
      the inline <script> in every AI-generated game bundle, and
      `default-src` alone would do it silently. It would break the whole
      site in production while every test still passed. The `sandbox`
      attribute on the frame is what contains that code, not this policy;
      see src/features/game/GameFrame.tsx.

      What is listed cannot reach scripts or styles. `connect-src` is
      inherited by the frame, so every origin added here is also an origin
      a published game could reach. publish.ts narrows that back down with a
      per-bundle `connect-src` of its own — see buildBundleCspMeta.

      The Sentry ingest origin is listed because that inheritance cuts both
      ways: the error-reporting snippet publish.ts appends runs *inside* the
      frame, so without it here the browser blocks every report and nothing
      says so. `npm run validate` cross-checks this origin against
      config/generation.json's sentryDsn.

      The four BYOK provider origins are listed for the same reason: those
      requests are made from this parent page (src/features/byok/providers.ts),
      not from inside the sandboxed frame, so without them here the browser
      blocks every BYOK generation in production even though every test —
      none of which enforces CSP — stays green.

      `frame-ancestors` is deliberately absent too: browsers ignore it in a
      meta CSP, and GitHub Pages cannot set response headers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="connect-src 'self' https://ixmnxcnxxyoyglthknmk.supabase.co https://o4512003238199296.ingest.us.sentry.io https://openrouter.ai https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; form-action 'none'; base-uri 'none'; object-src 'none'"
    />
    <!--
      Quicksand for the title, Nunito for the interface, JetBrains Mono for
      keycaps and the model name. Loaded from Google Fonts rather than
      self-hosted: there is no asset pipeline for binaries here, and
      `assemble-site.ts` only merges the build with published bundles.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>Daily Game</title>
    <!--
      Paints the right theme before React mounts, so a visitor who chose
      light does not get a flash of dark first.

      Inline, which this CSP deliberately permits — see the note above:
      adding `script-src` to allow it via a hash would cascade into every
      AI-generated bundle and break the site. The sandbox contains that
      code, not this policy.

      Cannot import src/features/theme/theme.ts, so the storage key and the
      attribute name are hardcoded here; a test in
      src/features/theme/__tests__/theme.test.ts fails if they drift apart
      from that module's exports.
    -->
    <script>
      (function () {
        // Guarded separately, not in one try: `localStorage` throws outright
        // in Safari's private mode, and swallowing that alongside the media
        // query would force light on a visitor whose system asks for dark.
        var stored = null;
        try {
          stored = localStorage.getItem('daily-game:theme');
        } catch (storageDenied) {
          /* no remembered choice, then */
        }

        var theme = stored === 'light' || stored === 'dark' ? stored : null;
        if (theme === null) {
          try {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (noMediaQueries) {
            theme = 'light';
          }
        }

        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <meta
      name="description"
      content="A complete browser game, invented from scratch by AI and rebuilt from nothing once a day."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

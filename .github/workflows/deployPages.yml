# Builds the React app, merges in the published game content, and deploys
# the result to GitHub Pages.
#
# Runs on every push to main, so both a human commit and the daily
# generation job's commit republish the site.
#
# NOTE: this requires Pages to be configured with "GitHub Actions" as its
# source (Settings → Pages → Build and deployment → Source), not
# "Deploy from a branch" — the site is assembled at build time and never
# exists in the repo as a servable directory.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so the site is
# never left half-published; queue at most one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Repeated from ci.yml rather than depended on: deploy has to stay a
      # plain `push` trigger, so nothing here can gate on another workflow's
      # result. These are what actually stop a bad push from reaching Pages.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate config and history
        run: npm run validate

      - name: Install Chromium for the smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build and assemble the site
        run: npm run build:site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

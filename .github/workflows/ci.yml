# Every gate the repo has, on pull requests and on main.
#
# Runs on push to main as well as pull requests for the same reason the
# secret scan does: an admin is exempt from the review requirement on main,
# so a PR-only trigger would never fire on the path most changes take.
#
# Deploy does not depend on this run and must not be made to. Its own build
# job repeats these gates, which is what actually stops a bad push from
# reaching Pages; see the deploy trigger invariant in CLAUDE.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded run on the same branch has nothing left to prove.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cheapest first: these need no browser and fail in seconds.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate config and history
        run: npm run validate

      # The smoke tests drive headless Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs both suites, and fails if either drops below the coverage
      # thresholds in vitest.config.ts and package.json.
      - name: Test with coverage
        run: npm run coverage

      - name: Build and assemble the site
        run: npm run build:site

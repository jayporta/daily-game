# Builds the React app, merges in the published game content, and deploys
# the result to GitHub Pages.
#
# Runs on every push to main, so both a human commit and the daily
# generation job's commit republish the site.
#
# NOTE: this requires Pages to be configured with "GitHub Actions" as its
# source (Settings → Pages → Build and deployment → Source), not
# "Deploy from a branch" — the site is assembled at build time and never
# exists in the repo as a servable directory.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so the site is
# never left half-published; queue at most one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The smoke tests drive headless Chromium.
      - name: Install Chromium for the smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build and assemble the site
        run: npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

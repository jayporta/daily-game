# Builds the React app, merges in the published game content, and deploys
# the result to GitHub Pages.
#
# Runs on every push to main, so both a human commit and the daily
# generation job's commit republish the site.
#
# NOTE: this requires Pages to be configured with "GitHub Actions" as its
# source (Settings → Pages → Build and deployment → Source), not
# "Deploy from a branch" — the site is assembled at build time and never
# exists in the repo as a servable directory.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so the site is
# never left half-published; queue at most one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Repeated from ci.yml rather than depended on: deploy has to stay a
      # plain `push` trigger, so nothing here can gate on another workflow's
      # result. These are what actually stop a bad push from reaching Pages.
      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate config and history
        run: npm run validate

      - name: Install Chromium for the smoke tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Build and assemble the site
        run: npm run build:site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# Builds the React app, merges in the published game content, and deploys
# the result to GitHub Pages.
#
# Runs on every push to main, so both a human commit and the daily
# generation job's commit republish the site.
#
# NOTE: this requires Pages to be configured with "GitHub Actions" as its
# source (Settings → Pages → Build and deployment → Source), not
# "Deploy from a branch" — the site is assembled at build time and never
# exists in the repo as a servable directory.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by generate-daily-game.yml. A push made with GITHUB_TOKEN does not
  # trigger other workflows, so the daily job invokes this one directly.
  workflow_call:
    inputs:
      skip_tests:
        description: >-
          Set by a caller that has already run the suite against this commit.
          Not inferable here: inside a called workflow `github.event_name` is
          the caller's own trigger (`schedule`), never `workflow_call`.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so the site is
# never left half-published; queue at most one pending run behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Skipped when the daily job called this workflow: it installed Chromium
      # and ran this same suite minutes earlier against the same commit. On a
      # push or a manual run the input is unset, so both steps run.
      - name: Install Chromium for the smoke tests
        if: ${{ !inputs.skip_tests }}
        run: npx playwright install --with-deps chromium

      - name: Test
        if: ${{ !inputs.skip_tests }}
        run: npm test

      - name: Build and assemble the site
        run: npm run build:site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

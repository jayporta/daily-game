# Builds one game a day and publishes it.
#
# No step here branches on whether OPENROUTER_API_KEY exists:
# scripts/lib/get-client.ts falls back to fixture responses when it is unset,
# so a fork with no credentials runs this workflow unchanged.
name: Generate daily game

on:
  schedule:
    # Duplicated by hand from cronSchedule in config/generation.json, which
    # Actions cannot read. Change both together — the config copy drives the
    # front-end countdown.
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the whole pipeline but write nothing to disk
        type: boolean
        default: false
      force_model:
        description: Pin every attempt to one model id, skipping the rotation
        type: string
        required: false

permissions:
  contents: write

# One generation at a time. Two runs would race for the same day's slug and
# the same history entry.
concurrency:
  group: generate-daily-game
  cancel-in-progress: false

# Everything the pipeline may write. Both the change check and `git add` use
# this list, so they can never disagree about what is being committed.
env:
  PUBLISHED_PATHS: manifest.json games/archive history

jobs:
  generate:
    runs-on: ubuntu-latest
    # Three attempts, each a model call plus a browser smoke test, measured at
    # ~5 minutes. This bounds a provider that accepts the connection and then
    # never answers, rather than letting GitHub's 6-hour default apply.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the push step below can rebase.
          fetch-depth: 0
          # main requires a reviewed PR; GITHUB_TOKEN authenticates as the
          # github-actions bot, which isn't exempt, so the commit-and-push
          # step below would be rejected. This PAT belongs to a repo admin,
          # who is exempt (enforce_admins is off), while non-admins still
          # can't push directly. Scope: Contents read/write on this repo only.
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The smoke test drives headless Chromium.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Before any API call, so a hand-edit to config/ fails in seconds
      # rather than three attempts in.
      - name: Validate config and history
        run: npm run validate

      # Inputs arrive as environment variables rather than being interpolated
      # into the script: a `${{ }}` expression in a run block is substituted
      # as text before bash sees it, so a crafted force_model would run as a
      # command. They are empty on a schedule run.
      - name: Generate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REACTION_STORE_KEY: ${{ secrets.REACTION_STORE_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE_MODEL: ${{ inputs.force_model }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$FORCE_MODEL" ]; then
            args+=("--force-model=$FORCE_MODEL")
          fi
          node --experimental-strip-types scripts/call-openrouter.ts "${args[@]}"

      # Distils the hot window into the lessons note the next prompt reads.
      # Like the rollup, it must not cost an already-published game its commit.
      - name: Reflect on recent games
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node --experimental-strip-types scripts/reflect-lessons.ts "${args[@]}"

      # After the day's entry exists so it counts toward the trigger, and
      # before the change check so the archive lands in the same commit.
      - name: Roll up history
        # A failed step skips the commit below, which would discard a game
        # that is already generated, moderated and smoke-tested. Compaction
        # is maintenance: it can wait for tomorrow's run.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node --experimental-strip-types scripts/rollup-history.ts "${args[@]}"

      # The tree is the source of truth for what happened. Three failed
      # attempts is a successful run that writes only history and leaves
      # manifest.json alone, so the two questions are asked separately.
      - name: Check what changed
        id: publish-check
        run: |
          # Split into separate pathspecs explicitly, rather than relying on
          # the shell to word-split an unquoted expansion.
          read -ra paths <<< "$PUBLISHED_PATHS"
          changed=false
          published=false
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            changed=true
          fi
          if [ -n "$(git status --porcelain -- manifest.json)" ]; then
            published=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.publish-check.outputs.changed == 'true'
        env:
          PUBLISHED: ${{ steps.publish-check.outputs.published }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          read -ra paths <<< "$PUBLISHED_PATHS"
          git add -- "${paths[@]}"
          if [ "$PUBLISHED" = "true" ]; then
            message="Publish $(jq -r .slug manifest.json)"
          else
            message="Record failed generation for $(date -u +%Y-%m-%d), previous game kept"
          fi
          git commit -m "$message"

          # A push to main while this run was generating makes the push a
          # non-fast-forward. The day's game is already generated, moderated
          # and smoke-tested by this point, so rebase onto the new tip and
          # retry rather than discarding it and failing the run.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto the new tip."
            git pull --rebase
          done
          echo "::error::Could not push the day's game after 3 attempts."
          exit 1

      - name: Summary
        run: |
          {
            echo "### Daily generation"
            echo "- published: ${{ steps.publish-check.outputs.published }}"
            echo "- committed: ${{ steps.publish-check.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"

# Greps the published surface for credential shapes before a PR can land.
#
# Defense in depth, not the primary control: config/reaction-config.json is
# validated against a service_role tripwire in scripts/lib/schema.ts, and the
# real keys live in Actions secrets. This catches a key pasted somewhere it
# would ship to visitors.
name: Secret scan

on: pull_request

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed published files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only what this PR touches, and only what ships to visitors.
          # config/reaction-config.json is excluded on purpose: it will
          # legitimately carry a public anon JWT once Epic 6 lands.
          files=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" \
            -- 'games/archive/**' manifest.json index.html 'src/**' || true)

          if [ -z "$files" ]; then
            echo "No published files changed."
            exit 0
          fi

          echo "Scanning:"
          echo "$files" | sed 's/^/  /'

          # sk-or-v1-  OpenRouter key
          # service_role  privileged Supabase JWT payload claim
          # https://...@...ingest...sentry.io  Sentry DSN with its secret
          pattern='sk-or-v1-[A-Za-z0-9]|service_role|https://[A-Za-z0-9]+@[A-Za-z0-9.-]*ingest[A-Za-z0-9.-]*sentry\.io'

          if echo "$files" | xargs grep -nEI "$pattern"; then
            echo
            echo "::error::A credential-shaped string was found in a file that ships to visitors."
            exit 1
          fi

          echo "Clean."

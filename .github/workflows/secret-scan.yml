# Greps the published surface for credential shapes before it can ship.
#
# Defense in depth, not the primary control: config/reaction-config.json is
# validated against a service_role tripwire in
# scripts/lib/config/reactionConfig.ts, and the real keys live in Actions
# secrets. This catches a key pasted somewhere it would reach visitors.
#
# Runs on pushes to main as well as pull requests: this repo is worked by
# committing straight to main, so a PR-only trigger would never fire on the
# path a leak would actually take.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed published files
        env:
          # On a pull_request these bracket the PR; on a push they bracket the
          # pushed range. `before` is all-zeroes for a branch's first push, so
          # the step falls back to scanning the whole published surface rather
          # than diffing against a commit that does not exist.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Only what changed, and only what ships to visitors.
          #
          # config/reaction-config.json is excluded on purpose: it carries a
          # public, insert-only key by design, and validateReactionConfig is
          # what refuses a privileged one there. __tests__ is excluded because
          # nothing there reaches the bundle, and the Sentry tests need a
          # DSN-shaped literal to assert against.
          paths=(
            'games/archive/**'
            manifest.json
            index.html
            'src/**'
            ':(exclude)src/**/__tests__/**'
          )

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit — scanning the whole published surface."
            files=$(git ls-files -- "${paths[@]}")
          else
            files=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA" -- "${paths[@]}")
          fi

          if [ -z "$files" ]; then
            echo "No published files changed."
            exit 0
          fi

          echo "Scanning:"
          echo "$files" | sed 's/^/  /'

          # sk-or-v1-  OpenRouter key
          # sb_secret_  Supabase secret key
          # service_role  privileged Supabase JWT payload claim
          # https://...@...ingest...sentry.io  Sentry DSN with its secret
          pattern='sk-or-v1-[A-Za-z0-9]|sb_secret_|service_role|https://[A-Za-z0-9]+@[A-Za-z0-9.-]*ingest[A-Za-z0-9.-]*sentry\.io'

          if echo "$files" | xargs grep -nEI "$pattern"; then
            echo
            echo "::error::A credential-shaped string was found in a file that ships to visitors."
            exit 1
          fi

          echo "Clean."

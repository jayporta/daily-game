    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    function getGridCol(x) {
      return Math.max(0, Math.min(MAZE_WIDTH - 1, Math.floor(x / GRID_SIZE)));
    }
    
    function getGridRow(y) {
      return Math.max(0, Math.min(MAZE_HEIGHT - 1, Math.floor(y / GRID_SIZE)));
    }
    
    function isWall(col, row) {
      if (col < 0 || col >= MAZE_WIDTH || row < 0 || row >= MAZE_HEIGHT) return true;
      return maze[row][col] === 1;
    }
    
    function isValidPosition(col, row) {
      if (col < 0 || col >= MAZE_WIDTH || row < 0 || row >= MAZE_HEIGHT) return false;
      if (isWall(col, row)) return false;
      return true;
    }
    
    function findEmptyPosition(excludeCol, excludeRow) {
      const candidates = [];
      for (let r = 0; r < MAZE_HEIGHT; r++) {
        for (let c = 0; c < MAZE_WIDTH; c++) {
          if (c !== excludeCol || r !== excludeRow) {
            if (maze[r][c] === 0) {
              candidates.push({ col: c, row: r });
            }
          }
        }
      }
      if (candidates.length === 0) return null;
      const idx = Math.floor(Math.random() * candidates.length);
      return candidates[idx];
    }
    
    function placeKeys() {
      keys = [];
      collectedKeys = 0;
      let placed = 0;
      while (placed < TOTAL_KEYS) {
        const pos = findEmptyPosition(player.col, player.row);
        if (pos === null) break;
        let overlap = false;
        for (let k = 0; k < keys.length; k++) {
          if (keys[k].col === pos.col && keys[k].row === pos.row) {
            overlap = true;
            break;
          }
        }
        if (!overlap) {
          keys.push({ col: pos.col, row: pos.row });
          placed++;
        }
      }
    }
    
    function placeExit() {
      let attempts = 0;
      while (attempts < 100) {
        const col = Math.floor(Math.random() * (MAZE_WIDTH - 2)) + 1;
        const row = Math.floor(Math.random() * (MAZE_HEIGHT - 2)) + 1;
        if (!isWall(col, row)) {
          let onKey = false;
          for (let k = 0; k < keys.length; k++) {
            if (keys[k].col === col && keys[k].row === row) {
              onKey = true;
              break;
            }
          }
          if (!onKey) {
            exit = { col: col, row: row };
            return;
          }
        }
        attempts++;
      }
      exit = { col: MAZE_WIDTH - 2, row: 1 };
    }
    
    function checkWin() {
      if (collectedKeys >= TOTAL_KEYS) {
        let atExit = false;
        for (let k = 0; k < keys.length; k++) {
          if (keys[k] !== null && player.col === keys[k].col && player.row === keys[k].row) {
            // already collected
          }
        }
        if (player.col === exit.col && player.row === exit.row) {
          return true;
        }
      }
      return false;
    }
    
    function handleKeyDown(e) {
      let newCol = player.col;
      let newRow = player.row;
      
      if (e.key === 'ArrowUp') newRow--;
      else if (e.key === 'ArrowDown') newRow++;
      else if (e.key === 'ArrowLeft') newCol--;
      else if (e.key === 'ArrowRight') newCol++;
      
      if (isValidPosition(newCol, newRow)) {
        player.col = newCol;
        player.row = newRow;
        checkCollection();
        checkWin();
      }
    }
    
    function checkCollection() {
      for (let k = 0; k < keys.length; k++) {
        if (keys[k] !== null && player.col === keys[k].col && player.row === keys[k].row) {
          collectedKeys++;
          keys[k] = null;
          break;
        }
      }
      placeExit();
    }
    
    function drawMaze() {
      for (let r = 0; r < MAZE_HEIGHT; r++) {
        for (let c = 0; c < MAZE_WIDTH; c++) {
          if (maze[r][c] === 1) {
            ctx.fillStyle = '#1a0a2e';
            ctx.fillRect(c * GRID_SIZE, r * GRID_SIZE, GRID_SIZE, GRID_SIZE);
            ctx.fillStyle = '#2a1a4e';
            ctx.fillRect(c * GRID_SIZE + 2, r * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
          }
        }
      }
    }
    
    function drawKeys() {
      for (let k = 0; k < keys.length; k++) {
        if (keys[k] !== null) {
          const gradient = ctx.createRadialGradient(

            keys[k].row * GRID_SIZE + GRID_SIZE / 2,
            0,
            keys[k].col * GRID_SIZE + GRID_SIZE / 2,
            keys[k].row * GRID_SIZE + GRID_SIZE / 2,
            GRID_SIZE / 2

          gradient.addColorStop(0, '#ff1a1a');
          gradient.addColorStop(0.5, '#ff5a5a');

          ctx.beginPath();

          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.fill();

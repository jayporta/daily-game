<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="utf-8">
<title>Glowfire Maze</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
#gameCanvas {
  display: block;
  width: 100vw;
  height: 100vh;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
"use strict";

// ---------- Constants ----------
const CELL_SIZE = 40;
const KEY_COUNT = 3;
const TIME_LIMIT = 60000; // ms
const SHIFT_INTERVAL = 3000; // ms

// ---------- Global State ----------
let canvas, ctx;
let shiftIntervalId;
let gameState = {
  grid: null,
  playerX: 0,
  playerY: 0,
  keys: [],
  collectedKeys: 0,
  collectedKeysSet: null,
  exitX: 0,
  exitY: 0,
  wallList: [],
  timeLeft: TIME_LIMIT,
  startTime: 0,
  lastMoveTime: 0,
  gameOver: false,
  win: false,
  paused: false,
  direction: null,
  running: false
};
let keysDown = {};

// ---------- Utility Functions ----------
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ---------- Maze Generation ----------
function generateMaze(cols, rows) {
  const grid = Array.from({ length: rows }, () => Array(cols).fill(true));
  const stack = [];
  const startX = 1;
  const startY = 1;
  grid[startY][startX] = false;
  stack.push([startX, startY]);
  const dirs = [[0, 2], [2, 0], [0, -2], [-2, 0]];
  while (stack.length > 0) {
    const [cx, cy] = stack[stack.length - 1];
    shuffleArray(dirs);
    let moved = false;
    for (const [dx, dy] of dirs) {
      const nx = cx + dx;
      const ny = cy + dy;
      if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && grid[ny][nx]) {
        grid[ny][nx] = false;
        grid[cy + dy / 2][cx + dx / 2] = false;
        stack.push([nx, ny]);
        moved = true;
        break;
      }
    }
    if (!moved) stack.pop();
  }
  return grid;
}

// ---------- Placement ----------
function placeKeysAndExit(grid, cols, rows) {
  const pathCells = [];
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (!grid[y][x]) pathCells.push({ x, y });
    }
  }
  shuffleArray(pathCells);
  const exitCell = pathCells.shift();
  const exitX = exitCell.x;
  const exitY = exitCell.y;
  const keyPositions = [];
  for (let i = 0; i < KEY_COUNT && i < pathCells.length; i++) {
    keyPositions.push({ x: pathCells[i].x, y: pathCells[i].y });
  }
  let startCell;
  if (pathCells.length > 0) {
    const startIndex = Math.floor(Math.random() * pathCells.length);
    startCell = { x: pathCells[startIndex].x, y: pathCells[startIndex].y };
    pathCells.splice(startIndex, 1);
  } else {
    // fallback
    const randIndex = Math.floor(Math.random() * pathCells.length);
    startCell = { x: pathCells[randIndex].x, y: pathCells[randIndex].y };
  }
  return {
    startX: startCell.x,
    startY: startCell.y,
    keyPositions,
    exitX,
    exitY
  };
}

// ---------- Wall List ----------
function buildWallList(grid) {
  const list = [];
  for (let y = 0; y < grid.length; y++) {
    for (let x = 0; x < grid[y].length; x++) {
      if (grid[y][x]) list.push({ x, y });
    }
  }
  return list;
}

// ---------- Wall Shifting ----------
function shiftWalls() {
  if (gameState.wallList.length === 0) return;
  const idx = Math.floor(Math.random() * gameState.wallList.length);
  const cell = gameState.wallList[idx];
  const x = cell.x;
  const y = cell.y;
  const grid = gameState.grid;
  if (grid[y][x]) {
    // wall -> path
    grid[y][x] = false;
    gameState.wallList.splice(idx, 1);
  } else {
    // path -> wall
    grid[y][x] = true;
    gameState.wallList.push({ x, y });
  }
}

// ---------- Drawing ----------
function drawMaze(ctx, grid) {
  const cols = grid[0].length;
  const rows = grid.length;
  ctx.fillStyle = '#2c2c2c';
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x]) {
        ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
    }
  }
}

function drawStar(ctx, x, y, size = CELL_SIZE * 0.4, color = '#fff') {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  const spikes = 5;
  const outerRadius = size;
  const innerRadius = size * 0.5;
  let rot = Math.PI / 2 * 3;
  const x0 = x;
  const y0 = y;
  ctx.moveTo(x0, y0);
  for (let i = 0; i < spikes; i++) {
    const r = i % 2 === 0 ? outerRadius : innerRadius;
    const nx = x0 + Math.cos(rot) * r;
    const ny = y0 + Math.sin(rot) * r;
    ctx.lineTo(nx, ny);
    rot += Math.PI / spikes;
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFirefly(ctx, x, y) {
  ctx.save();
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ffeb3b';
  ctx.fillStyle = '#fffde7';
  ctx.beginPath();
  ctx.arc(x * CELL_SIZE + CELL_SIZE / 2, y * CELL_SIZE + CELL_SIZE / 2, CELL_SIZE * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawExit(ctx, x, y, opened) {
  const cx = x * CELL_SIZE + CELL_SIZE / 2;
  const cy = y * CELL_SIZE + CELL_SIZE / 2;
  ctx.save();
  if (opened) {
    ctx.fillStyle = '#4caf50';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#4caf50';
  } else {
    ctx.fillStyle = '#795548';
  }
  ctx.beginPath();
  ctx.arc(cx, cy, CELL_SIZE * 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawKeys(ctx, keys, collectedSet) {
  keys.forEach((key, index) => {
    if (!collectedSet.has(index)) {
      drawStar(ctx, key.x, key.y);
    }
  });
}

function drawUI(ctx, state) {
  ctx.fillStyle = '#fff';
  ctx.font = '20px sans-serif';
  ctx.shadowBlur = 0;
  ctx.fillText(`Keys: ${state.collectedKeys}/${KEY_COUNT}`, 20, 30);
  const secondsLeft = Math.ceil(state.timeLeft / 1000);
  ctx.fillText(`Time: ${secondsLeft}s`, canvas.width - 120, 30);
  ctx.font = '16px sans-serif';
  ctx.fillText('Collect 3 keys and reach the exit!', canvas.width / 2 - 120, 55);
}

// ---------- Game Loop ----------
function gameLoop() {
  if (!gameState.running) return;
  const now = Date.now();
  // Update timer
  if (!gameState.paused && !gameState.gameOver) {
    gameState.timeLeft -= now - gameState.lastMoveTime;
    gameState.lastMoveTime = now;
    if (gameState.timeLeft <= 0) {
      gameState.timeLeft = 0;
      gameState.gameOver = true;
      gameState.win = false;
    }
  }
  // Movement
  if (!gameState.paused && !gameState.gameOver && gameState.direction) {
    const dx = gameState.direction.dx;
    const dy = gameState.direction.dy;
    const nx = gameState.playerX + dx;
    const ny = gameState.playerY + dy;
    const grid = gameState.grid;
    if (nx >= 0 && nx < grid[0].length && ny >= 0 && ny < grid.length) {
      if (!grid[ny][nx]) {
        // Check for key
        let keyCollected = false;
        for (let i = 0; i < gameState.keys.length; i++) {
          const k = gameState.keys[i];
          if (k.x === nx && k.y === ny && !gameState.collectedKeysSet.has(i)) {
            gameState.collectedKeysSet.add(i);
            gameState.collectedKeys++;
            keyCollected = true;
            break;
          }
        }
        gameState.playerX = nx;
        gameState.playerY = ny;
        if (nx === gameState.exitX && ny === gameState.exitY && gameState.collectedKeys === KEY_COUNT) {
          gameState.gameOver = true;
          gameState.win = true;
        }
      }
    }
    gameState.direction = null;
  }
  // Clear and draw
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMaze(ctx, gameState.grid);
  drawKeys(ctx, gameState.keys, gameState.collectedKeysSet);
  drawExit(ctx, gameState.exitX, gameState.exitY, gameState.collectedKeys === KEY_COUNT);
  drawFirefly(ctx, gameState.playerX, gameState.playerY);
  drawUI(ctx, gameState);
  // Game over overlay
  if (gameState.gameOver) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = '36px sans-serif';
    const msg = gameState.win ? 'You Win!' : 'Time’s up! Game Over!';
    ctx.fillText(msg, canvas.width / 2 - msg.length * 10, canvas.height / 2);
    ctx.font = '20px sans-serif';
    ctx.fillText('Press any key to restart', canvas.width / 2 - 90, canvas.height / 2 + 50);
    ctx.restore();
  }
  requestAnimationFrame(gameLoop);
}

// ---------- Input ----------
window.addEventListener('keydown', (e) => {
  const key = e.key;
  keysDown[key] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
    e.preventDefault();
  }
  if (gameState.gameOver) {
    restartGame();
    return;
  }
  if (key === ' ') {
    gameState.paused = !gameState.paused;
    if (!gameState.paused) {
      gameState.lastMoveTime = Date.now();
    }
  } else if (!gameState.paused && !gameState.gameOver) {
    let dx = 0, dy = 0;
    if (key === 'ArrowUp') dy = -1;
    else if (key === 'ArrowDown') dy = 1;
    else if (key === 'ArrowLeft') dx = -1;
    else if (key === 'ArrowRight') dx = 1;
    if (dx !== 0 || dy !== 0) {
      gameState.direction = { dx, dy };
      gameState.lastMoveTime = Date.now();
    }
  }
});

window.addEventListener('keyup', (e) => {
  delete keysDown[e.key];
});

// ---------- Restart ----------
function restartGame() {
  gameState.collectedKeys = 0;
  gameState.collectedKeysSet = new Set();
  gameState.timeLeft = TIME_LIMIT;
  gameState.gameOver = false;
  gameState.win = false;
  gameState.paused = false;
  initGame();
}

// ---------- Resize ----------
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';
  ctx.scale(dpr, dpr);
}

window.addEventListener('resize', () => {
  resizeCanvas();
  if (gameState.running) {
    restartGame();
  }
});

// ---------- Initialization ----------
function initGame() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  // Determine grid size (odd dimensions)
  let cols = Math.floor(canvas.width / CELL_SIZE);
  let rows = Math.floor(canvas.height / CELL_SIZE);
  if (cols % 2 === 0) cols += 1;
  if (rows % 2 === 0) rows += 1;
  // Generate maze
  const grid = generateMaze(cols, rows);
  // Place keys, exit, start
  const placement = placeKeysAndExit(grid, cols, rows);
  // Build wall list
  const wallList = buildWallList(grid);
  // Assign to gameState
  gameState.grid = grid;
  gameState.playerX = placement.startX;
  gameState.playerY = placement.startY;
  gameState.keys = placement.keyPositions;
  gameState.collectedKeys = 0;
  gameState.collectedKeysSet = new Set();
  gameState.exitX = placement.exitX;
  gameState.exitY = placement.exitY;
  gameState.wallList = wallList;
  gameState.timeLeft = TIME_LIMIT;
  gameState.startTime = Date.now();
  gameState.lastMoveTime = Date.now();
  gameState.gameOver = false;
  gameState.win = false;
  gameState.paused = false;
  // Start shifting walls
  if (shiftIntervalId) clearInterval(shiftIntervalId);
  shiftIntervalId = setInterval(() => {
    if (!gameState.paused && !gameState.gameOver) {
      shiftWalls();
    }
  }, SHIFT_INTERVAL);
  gameState.running = true;
  requestAnimationFrame(gameLoop);
}

// Start on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  initGame();
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="utf-8">
<title>Crystal Runner</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:sans-serif;}
#gameCanvas{position:absolute;left:0;top:0;width:100%;height:100%;}
#ui{position:absolute;left:0;top:0;padding:10px;color:#fff;font-size:20px;}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="ui"></div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiDiv = document.getElementById('ui');

const COLS = 13;
const ROWS = 9;
let cellSize = 0;
let maze = [];
let robot = {x:0, y:0};
let keysCollected = 0;
let totalKeys = 0;
let gameOver = false;
let win = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  cellSize = Math.min(canvas.width / COLS, canvas.height / ROWS);
  draw();
}
window.addEventListener('resize', resize);

function initMaze() {
  maze = [];
  totalKeys = 0;
  for (let y = 0; y < ROWS; y++) {
    const row = [];
    for (let x = 0; x < COLS; x++) {
      if (y === 0 && x === 1) {
        row.push('empty');
        robot.x = x;
        robot.y = y;
      } else if (Math.random() < 0.2) {
        row.push('wall');
      } else if (Math.random() < 0.05) {
        row.push('key');
        totalKeys++;
      } else {
        row.push('empty');
      }
    }
    maze.push(row);
  }
  const ex = COLS - 2;
  const ey = ROWS - 1;
  maze[ey][ex] = 'exit';
}

function shiftMaze() {
  for (let y = 0; y < ROWS; y++) {
    maze[y].shift();
    const r = Math.random();
    let cell;
    if (r < 0.3) cell = 'wall';
    else if (r < 0.35) cell = 'key';
    else cell = 'empty';
    maze[y].push(cell);
    if (cell === 'key') totalKeys++;
  }
  robot.x--;
  if (robot.x < 0) robot.x = COLS - 1;
  if (maze[robot.y][robot.x] === 'key') {
    keysCollected++;
    maze[robot.y][robot.x] = 'empty';
  }
}

function moveRobot(dx, dy) {
  if (gameOver || win) return;
  const nx = robot.x + dx;
  const ny = robot.y + dy;
  if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) {
    gameOver = true;
    draw();
    return;
  }
  if (maze[ny][nx] === 'wall') {
    gameOver = true;
    draw();
    return;
  }
  robot.x = nx;
  robot.y = ny;
  const cell = maze[robot.y][robot.x];
  if (cell === 'key') {
    keysCollected++;
    maze[robot.y][robot.x] = 'empty';
  } else if (cell === 'exit') {
    if (keysCollected === totalKeys) {
      win = true;
    } else {
      gameOver = true;
    }
    draw();
    return;
  }
  shiftMaze();
  draw();
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(cellSize, cellSize);
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const cell = maze[y][x];
      ctx.fillStyle = '#111';
      ctx.fillRect(x, y, 1, 1);
      if (cell === 'wall') {
        ctx.fillStyle = '#555';
        ctx.fillRect(x, y, 1, 1);
      } else if (cell === 'key') {
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x, y, 1, 1);
      } else if (cell === 'exit') {
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(x, y, 1, 1);
      }
    }
  }
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(robot.x, robot.y, 1, 1);
  ctx.restore();

  uiDiv.innerHTML = `Keys: ${keysCollected}/${totalKeys}`;
  if (gameOver) {
    ctx.fillStyle = '#ff4444';
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
  }
  if (win) {
    ctx.fillStyle = '#44ff44';
    ctx.font = '48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('You Win!', canvas.width / 2, canvas.height / 2);
  }
}

const directions = {
  ArrowUp: [0, -1],
  ArrowDown: [0, 1],
  ArrowLeft: [-1, 0],
  ArrowRight: [1, 0]
};

function onKeyDown(e) {
  if (gameOver || win) return;
  const dir = directions[e.key];
  if (dir) {
    moveRobot(dir[0], dir[1]);
  }
}
document.addEventListener('keydown', onKeyDown);

initMaze();
resize();
requestAnimationFrame(function loop() {
  draw();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>

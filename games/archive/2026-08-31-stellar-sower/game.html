<!doctype html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stellar Sower</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a1a;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  
  let W, H, scale;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    scale = Math.min(W, H) / 600;
  }
  window.addEventListener('resize', resize);
  resize();
  
  // Game state
  const STATE = { MENU: 0, PLAY: 1, WIN: 2, GAMEOVER: 3 };
  let state = STATE.MENU;
  let level = 0;
  let seedsLeft = 0;
  let seeds = [];
  let pods = [];
  let particles = [];
  let stars = [];
  
  // Slingshot
  const slingshot = { x: 80, y: 0, radius: 20 };
  let dragging = false;
  let dragX = 0, dragY = 0;
  const maxPull = 120;
  
  // Levels: pods = [{x%, y%, needs}]
  const levels = [
    [{ x: 0.65, y: 0.35, needs: 2 }],
    [{ x: 0.7, y: 0.3, needs: 2 }, { x: 0.55, y: 0.6, needs: 1 }],
    [{ x: 0.4, y: 0.25, needs: 2 }, { x: 0.75, y: 0.5, needs: 2 }, { x: 0.5, y: 0.7, needs: 1 }],
    [{ x: 0.35, y: 0.2, needs: 2 }, { x: 0.65, y: 0.25, needs: 2 }, { x: 0.5, y: 0.55, needs: 2 }, { x: 0.75, y: 0.7, needs: 1 }],
    [{ x: 0.3, y: 0.2, needs: 2 }, { x: 0.6, y: 0.2, needs: 2 }, { x: 0.45, y: 0.45, needs: 2 }, { x: 0.75, y: 0.5, needs: 2 }, { x: 0.35, y: 0.7, needs: 2 }]
  ];
  
  function generateStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.6 + 0.3,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }
  
  function loadLevel(n) {
    const lvl = levels[n];
    seedsLeft = 3 + lvl.length * 2;
    seeds = [];
    particles = [];
    pods = lvl.map(p => ({
      x: p.x * W,
      y: p.y * H,
      needs: p.needs,
      current: 0,
      pulse: 0,
      fillGlow: 0
    }));
    slingshot.y = H * 0.5;
  }
  
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 3 + 1;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color,
        size: Math.random() * 4 + 2
      });
    }
  }
  
  function launchSeed(power, angle) {
    if (seedsLeft <= 0) return;
    seedsLeft--;
    const speed = power * 12;
    seeds.push({
      x: slingshot.x,
      y: slingshot.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      trail: [],
      active: true
    });
    spawnParticles(slingshot.x, slingshot.y, '#ffcc44', 8);
  }
  
  function update(dt) {
    // Update stars twinkle
    stars.forEach(s => {
      s.twinkle += dt * 2;
    });
    
    if (state !== STATE.PLAY) return;
    
    // Update pods pulse
    pods.forEach(p => {
      p.pulse += dt * 3;
      if (p.fillGlow > 0) p.fillGlow -= dt * 0.5;
    });
    
    // Update seeds physics
    const gravity = 200;
    seeds.forEach(seed => {
      if (!seed.active) return;
      
      // Store trail
      seed.trail.push({ x: seed.x, y: seed.y });
      if (seed.trail.length > 20) seed.trail.shift();
      
      // Apply gravity
      seed.vy += gravity * dt;
      
      // Move
      seed.x += seed.vx * dt;
      seed.y += seed.vy * dt;
      
      // Bounce off walls
      const r = 8;
      if (seed.x < r) { seed.x = r; seed.vx *= -0.6; }
      if (seed.x > W - r) { seed.x = W - r; seed.vx *= -0.6; }
      if (seed.y < r) { seed.y = r; seed.vy *= -0.6; }
      if (seed.y > H - r) { seed.y = H - r; seed.vy *= -0.6; }
      
      // Check pod collision
      pods.forEach(pod => {
        const dx = seed.x - pod.x;
        const dy = seed.y - pod.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 35) {
          if (pod.current < pod.needs) {
            pod.current++;
            pod.fillGlow = 1;
            seed.active = false;
            spawnParticles(seed.x, seed.y, '#88ffaa', 15);
            spawnParticles(pod.x, pod.y, '#aaffcc', 10);
          }
        }
      });
      
      // Fade out if slow
      const speed = Math.sqrt(seed.vx * seed.vx + seed.vy * seed.vy);
      if (speed < 20 && seed.y > H - 30) {
        seed.active = false;
        spawnParticles(seed.x, seed.y, '#666677', 5);
      }
    });
    
    // Update particles
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 50 * dt;
      p.life -= dt * 1.5;
    });
    particles = particles.filter(p => p.life > 0);
    
    // Check win/lose
    const allFilled = pods.every(p => p.current >= p.needs);
    if (allFilled) {
      state = STATE.WIN;
      spawnParticles(W/2, H/2, '#aaffcc', 30);
    } else if (seedsLeft <= 0 && seeds.every(s => !s.active)) {
      state = STATE.GAMEOVER;
    }
  }
  
  function drawHexagon(cx, cy, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const angle = (Math.PI / 3) * i - Math.PI / 6;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  
  function render() {
    // Background
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(0.5, '#0f0f2a');
    grad.addColorStop(1, '#1a1a3a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    
    // Stars
    stars.forEach(s => {
      const twinkle = Math.sin(s.twinkle) * 0.3 + 0.7;
      ctx.fillStyle = `rgba(200, 220, 255, ${s.alpha * twinkle})`;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
      ctx.fill();
    });
    
    if (state === STATE.MENU) {
      drawMenu();
      return;
    }
    
    if (state === STATE.WIN) {
      drawPods();
      drawParticles();
      drawWin();
      return;
    }
    
    if (state === STATE.GAMEOVER) {
      drawPods();
      drawGameOver();
      return;
    }
    
    // Draw slingshot
    drawSlingshot();
    
    // Draw pods
    drawPods();
    
    // Draw seeds
    seeds.forEach(seed => {
      if (!seed.active) return;
      
      // Trail
      seed.trail.forEach((t, i) => {
        const alpha = i / seed.trail.length * 0.5;
        ctx.fillStyle = `rgba(255, 220, 100, ${alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 3, 0, Math.PI * 2);
        ctx.fill();
      });
      
      // Seed
      ctx.fillStyle = '#ffdd66';
      ctx.shadowColor = '#ffcc44';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(seed.x, seed.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });
    
    // Draw particles
    drawParticles();
    
    // Draw UI
    drawUI();
  }
  
  function drawSlingshot() {
    const sx = slingshot.x;
    const sy = slingshot.y;
    
    // Base
    ctx.fillStyle = '#445566';
    ctx.beginPath();
    ctx.arc(sx, sy, slingshot.radius, 0, Math.PI * 2);
    ctx.fill();
    
    // Inner ring
    ctx.strokeStyle = '#667788';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(sx, sy, slingshot.radius - 5, 0, Math.PI * 2);
    ctx.stroke();
    
    // Fork posts
    ctx.fillStyle = '#556677';
    ctx.fillRect(sx - 25, sy - 35, 8, 40);
    ctx.fillRect(sx + 17, sy - 35, 8, 40);
    
    if (dragging) {
      const pullX = Math.max(sx - maxPull, Math.min(sx + maxPull, dragX));
      const pullY = Math.max(sy - maxPull, Math.min(sy + maxPull, dragY));
      
      // Band
      ctx.strokeStyle = '#88aa88';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sx - 21, sy - 30);
      ctx.lineTo(pullX, pullY);
      ctx.lineTo(sx + 21, sy - 30);
      ctx.stroke();
      
      // Seed preview
      const dx = sx - pullX;
      const dy = sy - pullY;
      const pullDist = Math.sqrt(dx * dx + dy * dy);
      const power = Math.min(pullDist / maxPull, 1);
      
      ctx.fillStyle = `rgba(255, 220, 100, ${0.5 + power * 0.5})`;
      ctx.shadowColor = '#ffcc44';
      ctx.shadowBlur = 10 + power * 20;
      ctx.beginPath();
      ctx.arc(pullX, pullY, 8 + power * 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      // Power indicator
      ctx.fillStyle = '#aaffaa';
      ctx.font = `${14 * scale}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`Power: ${Math.round(power * 100)}%`, sx, sy + 55);
    }
  }
  
  function drawPods() {
    pods.forEach(pod => {
      const r = 30;
      const fillRatio = pod.current / pod.needs;
      const pulseScale = 1 + Math.sin(pod.pulse) * 0.05;
      const glowIntensity = 0.3 + fillRatio * 0.4 + pod.fillGlow * 0.3;
      
      // Outer glow
      ctx.shadowColor = '#88ffaa';
      ctx.shadowBlur = 20 + fillRatio * 15 + pod.fillGlow * 25;
      
      // Hexagon
      drawHexagon(pod.x, pod.y, r * pulseScale);
      ctx.fillStyle = `rgba(40, 80, 60, ${0.5 + glowIntensity * 0.3})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(136, 255, 170, ${0.6 + glowIntensity * 0.4})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.shadowBlur = 0;
      
      // Inner rings showing progress
      for (let i = 0; i < pod.needs; i++) {
        const ringR = 8 + i * 6;
        const ringFill = i < pod.current ? 1 : (i === pod.current ? fillRatio % 1 : 0);
        
        ctx.strokeStyle = i < pod.current ? '#aaffcc' : 'rgba(136, 255, 170, 0.3)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pod.x, pod.y, ringR, 0, Math.PI * 2 * ringFill);
        ctx.stroke();
      }
      
      // Center number
      ctx.fillStyle = '#aaffcc';
      ctx.font = `bold ${16 * scale}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${pod.current}/${pod.needs}`, pod.x, pod.y);
    });
  }
  
  function drawParticles() {
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  
  function drawUI() {
    // Seeds left
    ctx.fillStyle = '#ffdd88';
    ctx.font = `${20 * scale}px sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText(`Seeds: ${seedsLeft}`, 20, 35);
    
    // Level
    ctx.fillStyle = '#aaaacc';
    ctx.font = `${16 * scale}px sans-serif`;
    ctx.fillText(`Level ${level + 1}`, 20, 58);
  }
  
  function drawMenu() {
    // Title
    ctx.fillStyle = '#aaffcc';
    ctx.font = `bold ${48 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#88ffaa';
    ctx.shadowBlur = 20;
    ctx.fillText('Stellar Sower', W/2, H * 0.3);
    ctx.shadowBlur = 0;
    
    // Subtitle
    ctx.fillStyle = '#8899aa';
    ctx.font = `${18 * scale}px sans-serif`;
    ctx.fillText('Launch seeds into floating pods', W/2, H * 0.38);
    ctx.fillText('Fill all pods to complete each level', W/2, H * 0.43);
    
    // Start button
    const btnW = 180 * scale;
    const btnH = 50 * scale;
    const btnX = W/2 - btnW/2;
    const btnY = H * 0.55;
    
    ctx.fillStyle = '#2a4a3a';
    ctx.strokeStyle = '#88ffaa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = '#aaffcc';
    ctx.font = `bold ${20 * scale}px sans-serif`;
    ctx.fillText('Click to Start', W/2, btnY + btnH/2 + 7);
    
    // Instructions
    ctx.fillStyle = '#667788';
    ctx.font = `${14 * scale}px sans-serif`;
    ctx.fillText('Click and drag from the launcher to aim', W/2, H * 0.72);
    ctx.fillText('Release to launch seeds', W/2, H * 0.77);
  }
  
  function drawWin() {
    ctx.fillStyle = 'rgba(0, 30, 20, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#aaffcc';
    ctx.font = `bold ${42 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = '#88ffaa';
    ctx.shadowBlur = 25;
    ctx.fillText(level < levels.length - 1 ? 'Level Complete!' : 'You Win!', W/2, H * 0.35);
    ctx.shadowBlur = 0;
    
    const btnW = 200 * scale;
    const btnH = 50 * scale;
    const btnX = W/2 - btnW/2;
    const btnY = H * 0.5;
    
    ctx.fillStyle = '#2a4a3a';
    ctx.strokeStyle = '#88ffaa';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = '#aaffcc';
    ctx.font = `bold ${18 * scale}px sans-serif`;
    ctx.fillText(level < levels.length - 1 ? 'Next Level' : 'Play Again', W/2, btnY + btnH/2 + 6);
  }
  
  function drawGameOver() {
    ctx.fillStyle = 'rgba(30, 10, 10, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#ff8888';
    ctx.font = `bold ${36 * scale}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('Out of Seeds!', W/2, H * 0.35);
    
    const btnW = 180 * scale;
    const btnH = 50 * scale;
    const btnX = W/2 - btnW/2;
    const btnY = H * 0.5;
    
    ctx.fillStyle = '#4a2a2a';
    ctx.strokeStyle = '#ff8888';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(btnX, btnY, btnW, btnH, 10);
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = '#ffaaaa';
    ctx.font = `bold ${18 * scale}px sans-serif`;
    ctx.fillText('Try Again', W/2, btnY + btnH/2 + 6);
  }
  
  // Input handling
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    if (e.touches) {
      return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
    }
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  
  function handleStart(e) {
    e.preventDefault();
    const pos = getPos(e);
    
    if (state === STATE.MENU) {
      state = STATE.PLAY;
      level = 0;
      loadLevel(level);
      return;
    }
    
    if (state === STATE.WIN) {
      level++;
      if (level >= levels.length) level = 0;
      state = STATE.PLAY;
      loadLevel(level);
      return;
    }
    
    if (state === STATE.GAMEOVER) {
      state = STATE.PLAY;
      loadLevel(level);
      return;
    }
    
    if (state === STATE.PLAY && seedsLeft > 0) {
      dragging = true;
      dragX = pos.x;
      dragY = pos.y;
    }
  }
  
  function handleMove(e) {
    e.preventDefault();
    if (!dragging) return;
    const pos = getPos(e);
    dragX = pos.x;
    dragY = pos.y;
  }
  
  function handleEnd(e) {
    e.preventDefault();
    if (!dragging) return;
    
    const dx = slingshot.x - dragX;
    const dy = slingshot.y - dragY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > 10) {
      const power = Math.min(dist / maxPull, 1);
      const angle = Math.atan2(dy, dx);
      launchSeed(power, angle);
    }
    
    dragging = false;
  }
  
  canvas.addEventListener('mousedown', handleStart);
  canvas.addEventListener('mousemove', handleMove);
  canvas.addEventListener('mouseup', handleEnd);
  canvas.addEventListener('mouseleave', handleEnd);
  canvas.addEventListener('touchstart', handleStart, { passive: false });
  canvas.addEventListener('touchmove', handleMove, { passive: false });
  canvas.addEventListener('touchend', handleEnd, { passive: false });
  
  // Game loop
  let lastTime = 0;
  function loop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;
    
    update(dt);
    render();
    
    requestAnimationFrame(loop);
  }
  
  // Initialize
  generateStars();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

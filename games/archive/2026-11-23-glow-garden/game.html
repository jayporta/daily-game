<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Glow Garden</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#070912;}
canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
const canvas=document.getElementById('g');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=canvas.clientWidth;H=canvas.height=canvas.clientHeight;}
window.addEventListener('resize',resize);
resize();

const state={
  light:30, water:50, maxWater:100,
  heart:0, heartTarget:120,
  timeLeft:90, phase:'playing',
  grid:[], moths:[], parts:[],
  plantCost:15, waterCost:10
};
const COLS=7, ROWS=5;
let now=0;

function reset(){
  state.light=30; state.water=50; state.heart=0; state.timeLeft=90;
  state.phase='playing'; state.moths=[]; state.parts=[];
  state.grid=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    state.grid.push({r,c,type:0,grow:0,bloomT:0});
  }
}
reset();

function gridGeom(){
  const gs=Math.min(W*0.82,H*0.62);
  const gx=(W-gs)/2;
  const gy=150;
  return {gs,gx,gy,cw:gs/COLS,ch:gs/ROWS};
}
function tcx(t,geo){return geo.gx+(t.c+0.5)*geo.cw;}
function tcy(t,geo){return geo.gy+(t.r+0.5)*geo.ch;}

canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  if(state.phase!=='playing'){reset();return;}
  const geo=gridGeom();
  const col=Math.floor((x-geo.gx)/geo.cw), row=Math.floor((y-geo.gy)/geo.ch);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  const t=state.grid[row*COLS+col];
  if(t.type===0){
    if(state.light>=state.plantCost){state.light-=state.plantCost;t.type=1;t.grow=0;}
  }else if(t.type===1||t.type===2){
    if(state.water>=state.waterCost){state.water-=state.waterCost;t.grow+=35;}
  }else if(t.type===3){
    state.light+=25; t.type=0; t.grow=0; t.bloomT=0;
    spawnParts(tcx(t,geo),tcy(t,geo),'#fff9c4',10);
  }
});

function spawnMoth(t,geo){
  state.moths.push({x:tcx(t,geo),y:tcy(t,geo),tx:70,ty:H*0.52,t:0,speed:0.7+Math.random()*0.4,amt:10+Math.floor(Math.random()*8)});
}
function spawnParts(x,y,color,n){
  for(let i=0;i<n;i++){
    state.parts.push({x,y,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:0.5+Math.random()*0.5,color});
  }
}

function update(dt){
  if(state.phase!=='playing')return;
  state.timeLeft-=dt;
  if(state.timeLeft<=0){state.timeLeft=0;state.phase=state.heart>=state.heartTarget?'won':'lost';return;}
  state.water=Math.min(state.maxWater,state.water+dt*12);
  const geo=gridGeom();
  for(const t of state.grid){
    if(t.type===1||t.type===2){
      t.grow+=dt*14;
      if(t.type===1&&t.grow>=100){t.type=2;t.grow=0;}
      if(t.type===2&&t.grow>=100){t.type=3;t.grow=0;t.bloomT=0;spawnMoth(t,geo);}
    }else if(t.type===3){
      t.grow+=dt*9;
      t.bloomT+=dt;
      if(t.grow>=100){t.grow=0;state.light+=4;}
      if(t.bloomT>=6.5){t.bloomT=0;spawnMoth(t,geo);}
    }
  }
  for(let i=state.moths.length-1;i>=0;i--){
    const m=state.moths[i]; m.t+=dt*m.speed;
    if(m.t>=1){state.heart+=m.amt;state.moths.splice(i,1);spawnParts(m.tx,m.ty,'#00ffff',6);}
  }
  for(let i=state.parts.length-1;i>=0;i--){
    const p=state.parts[i]; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.vx*=0.92; p.vy*=0.92; p.life-=dt;
    if(p.life<=0)state.parts.splice(i,1);
  }
  if(state.heart>=state.heartTarget){state.heart=state.heartTarget;state.phase='won';}
}

function drawCrystal(x,y,size,color){
  ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=18;
  ctx.beginPath();
  ctx.moveTo(x,y-size);ctx.lineTo(x+size*0.7,y);ctx.lineTo(x,y+size*0.6);ctx.lineTo(x-size*0.7,y);ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;
}

function draw(){
  ctx.fillStyle='#070912';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W);
  g.addColorStop(0,'rgba(90,60,140,0.3)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a1626';
  for(let i=0;i<14;i++){
    const x=(i*113)%W, y=(i*79)%H, r=12+(i%7)*4;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.textAlign='left';ctx.fillStyle='#ffffff';ctx.font='bold 18px sans-serif';
  ctx.fillText('LIGHT',20,28);ctx.fillStyle='#ffeb3b';ctx.fillText(Math.floor(state.light),20,52);
  ctx.fillStyle='#ffffff';ctx.font='15px sans-serif';ctx.fillText('WATER',130,28);ctx.fillStyle='#4fc3f7';ctx.fillText(state.water+'/'+state.maxWater,130,52);
  ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 18px sans-serif';ctx.fillText('HEART',W/2,28);
  ctx.fillStyle='#ff5252';const hw=210;ctx.fillRect(W/2-hw/2,44,hw,10);
  ctx.fillStyle=state.phase==='won'?'#00ff88':'#ff5252';ctx.fillRect(W/2-hw/2,44,(state.heart/state.heartTarget)*hw,10);
  ctx.fillStyle='#ffffff';ctx.font='14px sans-serif';ctx.fillText(Math.floor(state.heart)+'/'+state.heartTarget,W/2,62);
  ctx.textAlign='right';ctx.fillStyle='#ffffff';ctx.font='bold 18px sans-serif';ctx.fillText('DUSK '+Math.ceil(state.timeLeft),W-20,28);
  ctx.textAlign='center';ctx.fillStyle='#cfd8dc';ctx.font='14px sans-serif';
  ctx.fillText('Plant seeds on soil (light). Water sprouts (water). Blooms send moths to the heart. Charge the heart before dusk.',W/2,H-26);
  const geo=gridGeom();
  drawCrystal(70,H*0.52,34,state.phase==='won'?'#00ff88':'#ff5252');
  ctx.fillStyle='#ffffff';ctx.font='13px sans-serif';ctx.fillText('HEART',70,H*0.52+52);
  for(const t of state.grid){
    const x=geo.gx+t.c*geo.cw,y=geo.gy+t.r*geo.ch;
    ctx.fillStyle='#2d1b16';ctx.fillRect(x+2,y+2,geo.cw-4,geo.ch-4);
    ctx.strokeStyle='#4a3733';ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,geo.cw-4,geo.ch-4);
    if(t.type===1){
      ctx.fillStyle='#8d6e63';ctx.beginPath();ctx.arc(x+geo.cw/2,y+geo.ch/2,6,0,Math.PI*2);ctx.fill();
    }else if(t.type===2){
      ctx.fillStyle='#66bb6a';ctx.fillRect(x+geo.cw/2-3,y+geo.ch/2-14,6,14);
      ctx.beginPath();ctx.moveTo(x+geo.cw/2,y+geo.ch/2-14);ctx.lineTo(x+geo.cw/2-6,y+geo.ch/2-6);ctx.lineTo(x+geo.cw/2+6,y+geo.ch/2-6);ctx.fill();
    }else if(t.type===3){
      const pulse=Math.sin(now*4+t.c+t.r)*0.15+1;
      ctx.fillStyle='#e040fb';ctx.shadowColor='#e040fb';ctx.shadowBlur=14;
      for(let k=0;k<6;k++){
        const a=(k/6)*Math.PI*2;
        ctx.beginPath();ctx.ellipse(x+geo.cw/2+Math.cos(a)*geo.cw*0.22,y+geo.ch/2+Math.sin(a)*geo.ch*0.22,geo.cw*0.18*pulse,geo.ch*0.12*pulse,a,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle='#fff9c4';ctx.beginPath();ctx.arc(x+geo.cw/2,y+geo.ch/2,geo.cw*0.14,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      if(t.bloomT>=6){ctx.strokeStyle='#e040fb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+geo.cw/2,y+geo.ch/2,geo.cw*0.35+Math.sin(now*6)*3,0,Math.PI*2);ctx.stroke();}
    }
  }
  for(const m of state.moths){
    const px=m.x+(m.tx-m.x)*m.t, py=m.y+(m.ty-m.y)*m.t;
    ctx.fillStyle='#00ffff';ctx.shadowColor='#00ffff';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
  for(const p of state.parts){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  }
  if(state.phase==='won'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#00ff88';ctx.font='bold 34px sans-serif';ctx.textAlign='center';
    ctx.fillText('GARDEN AWAKENED',W/2,H/2-20);
    ctx.fillStyle='#ffffff';ctx.font='17px sans-serif';
    ctx.fillText('Heart charged before dusk. Tap to play again.',W/2,H/2+22);
  }else if(state.phase==='lost'){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff5252';ctx.font='bold 34px sans-serif';ctx.textAlign='center';
    ctx.fillText('DUSK FELL',W/2,H/2-20);
    ctx.fillStyle='#ffffff';ctx.font='17px sans-serif';
    ctx.fillText('Heart not charged in time. Tap to play again.',W/2,H/2+22);
  }
}

let last=performance.now();
function loop(t){now=t;const dt=Math.min((t-last)/1000,0.05);last=t;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
</body>
</html>

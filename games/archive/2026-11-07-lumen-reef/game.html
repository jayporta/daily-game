<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen Reef</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050508;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
#game {
  display: block;
  width: 100vw;
  height: 100vh;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
.ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #fff;
}
.hud {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
#judge {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translateX(-50%);
  font-size: 34px;
  font-weight: 800;
  pointer-events: none;
  text-shadow: 0 0 14px currentColor;
}
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(2, 4, 10, 0.7);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  text-align: center;
  padding: 0 24px;
}
.overlay h1, .overlay h2 {
  margin: 0 0 10px;
  color: #4ade80;
}
.overlay p {
  margin: 0 0 22px;
  color: #cbd5e1;
  font-size: 17px;
  line-height: 1.5;
}
button {
  background: #4ade80;
  border: none;
  padding: 12px 26px;
  font-size: 17px;
  font-weight: 700;
  border-radius: 10px;
  color: #050508;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
}
button:hover {
  background: #86efac;
}
button:active {
  transform: scale(0.96);
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui">
  <div class="hud">
    <div id="score">Score: 0</div>
    <div id="level">Level: 1 / 3</div>
  </div>
  <div id="judge"></div>
  <div id="menu" class="overlay">
    <h1>LUMEN REEF</h1>
    <p>Tap the currents as the light reaches the reef.</p>
    <button id="startBtn">Begin</button>
  </div>
  <div id="end" class="overlay" style="display:none;">
    <h2 id="endTitle">Level Complete</h2>
    <p id="endMsg"></p>
    <button id="nextBtn">Next Level</button>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const judgeEl = document.getElementById('judge');
const menuEl = document.getElementById('menu');
const endEl = document.getElementById('end');
const endTitle = document.getElementById('endTitle');
const endMsg = document.getElementById('endMsg');
const startBtn = document.getElementById('startBtn');
const nextBtn = document.getElementById('nextBtn');

let width = 0;
let height = 0;
let dpr = 1;
const LANE_COUNT = 4;
const laneX = [];
let hitY = 0;
let startY = 0;
const TRAVEL_TIME = 0.75;

let state = 'MENU';
let currentLevelIndex = 0;
let levelStartTime = 0;
let now = 0;

let score = 0;
let combo = 0;
let maxCombo = 0;
let perfects = 0;
let goods = 0;
let misses = 0;

let activeNotes = [];
let particles = [];

let audioCtx = null;
let lastJudge = { text: '', color: '#fff', time: 0 };

const LANE_COLORS = ['#22d3ee', '#84cc16', '#f472b6', '#a78bfa'];

const LEVELS = [
  {
    name: 'Tide',
    bpm: 100,
    notes: [
      { beat: 0, lane: 0 }, { beat: 1, lane: 1 }, { beat: 2, lane: 2 }, { beat: 3, lane: 3 },
      { beat: 4, lane: 0 }, { beat: 4, lane: 2 }, { beat: 5, lane: 1 }, { beat: 5, lane: 3 },
      { beat: 6, lane: 0 }, { beat: 7, lane: 1 }, { beat: 8, lane: 2 }, { beat: 9, lane: 3 },
      { beat: 10, lane: 1 }, { beat: 11, lane: 2 }, { beat: 12, lane: 3 }, { beat: 13, lane: 0 },
      { beat: 14, lane: 0 }, { beat: 15, lane: 3 }
    ]
  },
  {
    name: 'Glow',
    bpm: 110,
    notes: [
      { beat: 0, lane: 0 }, { beat: 0.5, lane: 1 }, { beat: 1, lane: 2 }, { beat: 1.5, lane: 3 },
      { beat: 2, lane: 0 }, { beat: 2, lane: 2 }, { beat: 3, lane: 1 }, { beat: 3, lane: 3 },
      { beat: 4, lane: 0 }, { beat: 4.5, lane: 1 }, { beat: 5, lane: 2 }, { beat: 5.5, lane: 3 },
      { beat: 6, lane: 2 }, { beat: 6.5, lane: 0 }, { beat: 7, lane: 1 }, { beat: 7.5, lane: 3 },
      { beat: 8, lane: 0 }, { beat: 8.5, lane: 2 }, { beat: 9, lane: 1 }, { beat: 9.5, lane: 3 },
      { beat: 10, lane: 0 }, { beat: 11, lane: 1 }, { beat: 12, lane: 2 }, { beat: 13, lane: 3 },
      { beat: 14, lane: 1 }, { beat: 15, lane: 2 }
    ]
  },
  {
    name: 'Reef',
    bpm: 120,
    notes: [
      { beat: 0, lane: 0 }, { beat: 0, lane: 2 }, { beat: 0.5, lane: 1 }, { beat: 0.5, lane: 3 },
      { beat: 1, lane: 0 }, { beat: 1.5, lane: 2 }, { beat: 2, lane: 1 }, { beat: 2.5, lane: 3 },
      { beat: 3, lane: 0 }, { beat: 3, lane: 2 }, { beat: 3.5, lane: 1 }, { beat: 3.5, lane: 3 },
      { beat: 4, lane: 0 }, { beat: 4.5, lane: 2 }, { beat: 5, lane: 1 }, { beat: 5.5, lane: 3 },
      { beat: 6, lane: 0 }, { beat: 6, lane: 2 }, { beat: 7, lane: 1 }, { beat: 7, lane: 3 },
      { beat: 8, lane: 0 }, { beat: 8.5, lane: 1 }, { beat: 9, lane: 2 }, { beat: 9.5, lane: 3 },
      { beat: 10, lane: 0 }, { beat: 10.5, lane: 2 }, { beat: 11, lane: 1 }, { beat: 11.5, lane: 3 },
      { beat: 12, lane: 0 }, { beat: 13, lane: 1 }, { beat: 14, lane: 2 }, { beat: 15, lane: 3 }
    ]
  }
];

function resize() {
  dpr = window.devicePixelRatio || 1;
  width = canvas.clientWidth;
  height = canvas.clientHeight;
  canvas.width = Math.floor(width * dpr);
  canvas.height = Math.floor(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const margin = width * 0.1;
  const usable = width - margin * 2;
  laneX.length = 0;
  for (let i = 0; i < LANE_COUNT; i++) {
    laneX.push(margin + usable * (i + 0.5) / LANE_COUNT);
  }
  hitY = height * 0.78;
  startY = hitY - 220;
}

window.addEventListener('resize', resize);
resize();

function initAudio() {
  if (audioCtx) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx) audioCtx = new Ctx();
}

function playTone(freq, type, duration) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.4, t + duration);
  gain.gain.setValueAtTime(0.12, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 80,
      vy: (Math.random() - 0.5) * 80 - 30,
      life: 0.6,
      color: color
    });
  }
}

function updateHUD() {
  scoreEl.textContent = 'Score: ' + score;
  levelEl.textContent = 'Level: ' + (currentLevelIndex + 1) + ' / ' + LEVELS.length;
}

function startLevel(index) {
  const level = LEVELS[index];
  levelStartTime = performance.now() / 1000;
  now = 0;
  activeNotes.length = 0;
  for (const n of level.notes) {
    const hitTime = n.beat * 60 / level.bpm;
    activeNotes.push({
      lane: n.lane,
      hitTime: hitTime,
      spawnTime: hitTime - TRAVEL_TIME,
      judged: false
    });
  }
  activeNotes.sort(function (a, b) { return a.spawnTime - b.spawnTime; });
  state = 'PLAYING';
  updateHUD();
}

function resetGame() {
  score = 0;
  combo = 0;
  maxCombo = 0;
  perfects = 0;
  goods = 0;
  misses = 0;
  particles.length = 0;
  updateHUD();
}

function judgeHit(lane) {
  let best = null;
  let bestDiff = 999;
  for (let i = 0; i < activeNotes.length; i++) {
    const note = activeNotes[i];
    if (note.lane !== lane || note.judged) continue;
    const diff = now - note.hitTime;
    if (diff < -0.22) continue;
    if (diff > 0.16) continue;
    const ad = Math.abs(diff);
    if (ad < bestDiff) {
      bestDiff = ad;
      best = note;
    }
  }

  if (!best) {
    playTone(140, 'sawtooth', 0.05);
    return;
  }

  best.judged = true;
  const diff = now - best.hitTime;
  let judgment = '';
  let points = 0;
  let color = '#fff';

  if (Math.abs(diff) <= 0.05) {
    judgment = 'PERFECT';
    points = 100;
    color = '#22d3ee';
    perfects++;
    combo++;
    playTone(900, 'sine', 0.1);
  } else if (Math.abs(diff) <= 0.11) {
    judgment = 'GOOD';
    points = 50;
    color = '#84cc16';
    goods++;
    combo++;
    playTone(650, 'sine', 0.1);
  } else {
    judgment = 'MISS';
    points = 0;
    color = '#f472b6';
    misses++;
    combo = 0;
    playTone(110, 'sawtooth', 0.15);
  }

  score += points;
  if (combo > maxCombo) maxCombo = combo;
  lastJudge = { text: judgment, color: color, time: now };
  spawnParticles(laneX[lane], hitY, color);
  updateHUD();
}

function checkMisses() {
  for (let i = 0; i < activeNotes.length; i++) {
    const note = activeNotes[i];
    if (note.judged) continue;
    if (now > note.hitTime + 0.15) {
      note.judged = true;
      misses++;
      combo = 0;
      lastJudge = { text: 'MISS', color: '#f472b6', time: now };
      playTone(90, 'sawtooth', 0.2);
      updateHUD();
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function update(dt) {
  if (state !== 'PLAYING') return;
  now = performance.now() / 1000 - levelStartTime;

  checkMisses();

  activeNotes = activeNotes.filter(function (n) {
    return !n.judged || now - n.hitTime < 0.5;
  });

  const level = LEVELS[currentLevelIndex];
  const lastHit = Math.max.apply(null, level.notes.map(function (n) {
    return n.beat * 60 / level.bpm;
  }));

  if (now > lastHit + TRAVEL_TIME + 0.6) {
    endLevel();
  }

  updateParticles(dt);
}

function endLevel() {
  state = 'LEVEL_END';
  endEl.style.display = 'flex';
  endTitle.textContent = 'Level Complete';
  endMsg.textContent = 'Perfect: ' + perfects + '   Good: ' + goods + '   Miss: ' + misses + '   Max Combo: ' + maxCombo + '   Score: ' + score;

  if (currentLevelIndex >= LEVELS.length - 1) {
    endTitle.textContent = 'Reef Restored';
    nextBtn.textContent = 'Play Again';
    nextBtn.onclick = function () {
      currentLevelIndex = 0;
      resetGame();
      startLevel(0);
      endEl.style.display = 'none';
    };
  } else {
    nextBtn.textContent = 'Next Level';
    nextBtn.onclick = function () {
      currentLevelIndex++;
      startLevel(currentLevelIndex);
      endEl.style.display = 'none';
    };
  }
}

function handleLane(lane) {
  if (state === 'PLAYING') {
    judgeHit(lane);
  }
}

window.addEventListener('keydown', function (e) {
  if (state === 'PLAYING') {
    if (e.key >= '1' && e.key <= '4') {
      handleLane(parseInt(e.key, 10) - 1);
    }
  } else {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      initAudio();
      if (state === 'MENU') {
        menuEl.style.display = 'none';
        resetGame();
        startLevel(0);
      } else if (state === 'LEVEL_END') {
        nextBtn.click();
      }
    }
  }
});

canvas.addEventListener('mousedown', function (e) {
  initAudio();
  const rect = canvas.getBoundingClientRect();
  const scaleX = width / rect.width;
  const cx = (e.clientX - rect.left) * scaleX;
  let best = 0;
  let bestDist = Math.abs(cx - laneX[0]);
  for (let i = 1; i < LANE_COUNT; i++) {
    const d = Math.abs(cx - laneX[i]);
    if (d < bestDist) {
      bestDist = d;
      best = i;
    }
  }
  handleLane(best);
});

canvas.addEventListener('touchstart', function (e) {
  initAudio();
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = width / rect.width;
  const cx = (e.touches[0].clientX - rect.left) * scaleX;
  let best = 0;
  let bestDist = Math.abs(cx - laneX[0]);
  for (let i = 1; i < LANE_COUNT; i++) {
    const d = Math.abs(cx - laneX[i]);
    if (d < bestDist) {
      bestDist = d;
      best = i;
    }
  }
  handleLane(best);
});

startBtn.addEventListener('click', function () {
  initAudio();
  menuEl.style.display = 'none';
  resetGame();
  startLevel(0);
});

function drawCreature(cx, cy, t) {
  const glow = 18 + Math.sin(t * 6) * 4;
  ctx.fillStyle = 'rgba(74, 222, 128, 0.15)';
  ctx.beginPath();
  ctx.arc(cx, cy - 8, glow, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.ellipse(cx, cy, 22, 15, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath();
  ctx.ellipse(cx, cy - 4, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#22d3ee';
  ctx.lineWidth = 2.5;
  const wave = Math.sin(t * 10) * 5;
  for (let i = -1.2; i <= 1.2; i += 0.6) {
    ctx.beginPath();
    ctx.moveTo(cx + i * 11, cy + 15);
    ctx.quadraticCurveTo(cx + i * 11 + wave, cy + 42, cx + i * 15, cy + 64);
    ctx.stroke();
  }
}

function draw() {
  ctx.clearRect(0, 0, width, height);

  const bg = ctx.createLinearGradient(0, 0, 0, height);
  bg.addColorStop(0, '#02040a');
  bg.addColorStop(1, '#0a0a16');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, width, height);

  for (let i = 0; i < LANE_COUNT; i++) {
    const x = laneX[i];
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, height);
    ctx.stroke();

    ctx.strokeStyle = LANE_COLORS[i] + '1a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, startY);
    ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 7]);
  ctx.beginPath();
  ctx.moveTo(0, hitY);
  ctx.lineTo(width, hitY);
  ctx.stroke();
  ctx.setLineDash([]);

  for (let i = 0; i < activeNotes.length; i++) {
    const note = activeNotes[i];
    const progress = (now - note.spawnTime) / TRAVEL_TIME;
    if (progress < 0 || progress > 1.15) continue;
    const y = startY + progress * (hitY - startY);
    const x = laneX[note.lane];
    const alpha = note.judged ? 0.25 : 1;
    const r = note.judged ? 5 : 10;

    ctx.fillStyle = LANE_COLORS[note.lane];
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = LANE_COLORS[note.lane];
    ctx.lineWidth = 2;
    ctx.globalAlpha = alpha * 0.6;
    ctx.beginPath();
    ctx.arc(x, y, r + 5, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawCreature(width / 2, hitY + 52, now);

  if (now - lastJudge.time < 0.85) {
    const alpha = 1 - (now - lastJudge.time) / 0.85;
    ctx.fillStyle = lastJudge.color;
    ctx.globalAlpha = alpha;
    ctx.font = 'bold 32px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(lastJudge.text, width / 2, height * 0.44);
    ctx.globalAlpha = 1;
  }
}

let lastTime = performance.now();
function loop(t) {
  let dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt > 0.2) dt = 0.2;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>

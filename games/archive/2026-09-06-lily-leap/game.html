<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lily Leap</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H;
  const TILE = 48;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Colors
  const COLORS = {
    bg: '#0a1628',
    water: '#0d2847',
    platform: '#2d6a4f',
    platformLight: '#40916c',
    platformDark: '#1b4332',
    lily: '#52b788',
    lilyDark: '#2d6a4f',
    salamander: '#e76f51',
    salamanderDark: '#c1440e',
    firefly: '#ffd60a',
    fireflyGlow: '#fff3b0',
    gate: '#7b2cbf',
    gateLight: '#c77dff',
    star: '#e0e0e0'
  };

  // Game state
  let level = 0;
  let state = 'title'; // title, playing, levelComplete, gameComplete
  let transitionTimer = 0;
  let stars = [];

  // Salamander
  const sal = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    onGround: false,
    width: 30, height: 20,
    jumping: false,
    direction: 1
  };

  // Physics
  const GRAVITY = 0.6;
  const JUMP_FORCE = -13;
  const MOVE_SPEED = 5;
  const FRICTION = 0.85;

  // Input
  const keys = { left: false, right: false, jump: false };
  let jumpPressed = false;

  // Level data: platforms [{x, y, w, h, lily?}, ...], fireflies [{x, y}, ...], gate {x, y}
  const LEVELS = [
    // Level 1 - gentle introduction
    {
      platforms: [
        { x: 0, y: 0.85, w: 1.0, h: 0.15, lily: false },
        { x: 0.25, y: 0.65, w: 0.15, h: 0.04, lily: true },
        { x: 0.55, y: 0.55, w: 0.15, h: 0.04, lily: true },
        { x: 0.75, y: 0.4, w: 0.2, h: 0.04, lily: false }
      ],
      fireflies: [
        { x: 0.3, y: 0.55 },
        { x: 0.6, y: 0.45 },
        { x: 0.85, y: 0.3 }
      ],
      spawn: { x: 0.1, y: 0.75 },
      gate: { x: 0.85, y: 0.3 }
    },
    // Level 2 - more jumping
    {
      platforms: [
        { x: 0, y: 0.85, w: 0.2, h: 0.15, lily: false },
        { x: 0.35, y: 0.75, w: 0.12, h: 0.04, lily: true },
        { x: 0.55, y: 0.6, w: 0.12, h: 0.04, lily: true },
        { x: 0.75, y: 0.45, w: 0.12, h: 0.04, lily: true },
        { x: 0.5, y: 0.3, w: 0.2, h: 0.04, lily: false }
      ],
      fireflies: [
        { x: 0.4, y: 0.65 },
        { x: 0.6, y: 0.5 },
        { x: 0.8, y: 0.35 },
        { x: 0.55, y: 0.2 }
      ],
      spawn: { x: 0.08, y: 0.75 },
      gate: { x: 0.58, y: 0.2 }
    },
    // Level 3 - vertical climb
    {
      platforms: [
        { x: 0.4, y: 0.85, w: 0.2, h: 0.15, lily: false },
        { x: 0.15, y: 0.7, w: 0.12, h: 0.04, lily: true },
        { x: 0.6, y: 0.55, w: 0.12, h: 0.04, lily: true },
        { x: 0.3, y: 0.4, w: 0.12, h: 0.04, lily: true },
        { x: 0.65, y: 0.25, w: 0.12, h: 0.04, lily: true },
        { x: 0.35, y: 0.12, w: 0.25, h: 0.04, lily: false }
      ],
      fireflies: [
        { x: 0.2, y: 0.6 },
        { x: 0.65, y: 0.45 },
        { x: 0.35, y: 0.3 },
        { x: 0.7, y: 0.15 },
        { x: 0.45, y: 0.05 }
      ],
      spawn: { x: 0.45, y: 0.75 },
      gate: { x: 0.45, y: 0.02 }
    },
    // Level 4 - zigzag
    {
      platforms: [
        { x: 0.05, y: 0.85, w: 0.15, h: 0.15, lily: false },
        { x: 0.3, y: 0.75, w: 0.12, h: 0.04, lily: true },
        { x: 0.08, y: 0.6, w: 0.12, h: 0.04, lily: true },
        { x: 0.35, y: 0.45, w: 0.12, h: 0.04, lily: true },
        { x: 0.08, y: 0.3, w: 0.12, h: 0.04, lily: true },
        { x: 0.4, y: 0.18, w: 0.12, h: 0.04, lily: true },
        { x: 0.65, y: 0.1, w: 0.25, h: 0.04, lily: false }
      ],
      fireflies: [
        { x: 0.35, y: 0.65 },
        { x: 0.12, y: 0.5 },
        { x: 0.4, y: 0.35 },
        { x: 0.12, y: 0.2 },
        { x: 0.45, y: 0.08 }
      ],
      spawn: { x: 0.08, y: 0.75 },
      gate: { x: 0.75, y: 0.0 }
    },
    // Level 5 - final challenge
    {
      platforms: [
        { x: 0.45, y: 0.88, w: 0.1, h: 0.12, lily: false },
        { x: 0.2, y: 0.78, w: 0.08, h: 0.03, lily: true },
        { x: 0.65, y: 0.78, w: 0.08, h: 0.03, lily: true },
        { x: 0.4, y: 0.65, w: 0.08, h: 0.03, lily: true },
        { x: 0.15, y: 0.52, w: 0.08, h: 0.03, lily: true },
        { x: 0.55, y: 0.52, w: 0.08, h: 0.03, lily: true },
        { x: 0.35, y: 0.38, w: 0.08, h: 0.03, lily: true },
        { x: 0.7, y: 0.38, w: 0.08, h: 0.03, lily: true },
        { x: 0.15, y: 0.25, w: 0.08, h: 0.03, lily: true },
        { x: 0.45, y: 0.15, w: 0.25, h: 0.03, lily: false }
      ],
      fireflies: [
        { x: 0.24, y: 0.68 },
        { x: 0.68, y: 0.68 },
        { x: 0.44, y: 0.55 },
        { x: 0.18, y: 0.42 },
        { x: 0.58, y: 0.42 },
        { x: 0.38, y: 0.28 },
        { x: 0.74, y: 0.28 },
        { x: 0.18, y: 0.15 },
        { x: 0.52, y: 0.05 }
      ],
      spawn: { x: 0.48, y: 0.78 },
      gate: { x: 0.55, y: 0.05 }
    }
  ];

  let currentLevel = null;
  let platforms = [];
  let fireflies = [];
  let collectedFireflies = 0;
  let totalFireflies = 0;
  let gatePos = { x: 0, y: 0 };
  let gateAlpha = 0;

  // Stars background
  function initStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random() * 0.6,
        size: Math.random() * 2 + 0.5,
        twinkle: Math.random() * Math.PI * 2
      });
    }
  }

  function loadLevel(idx) {
    const lvl = LEVELS[idx];
    currentLevel = lvl;
    
    // Convert normalized to pixel
    platforms = lvl.platforms.map(p => ({
      x: p.x * W,
      y: p.y * H,
      w: p.w * W,
      h: p.h * H,
      lily: p.lily || false
    }));
    
    fireflies = lvl.fireflies.map(f => ({
      x: f.x * W,
      y: f.y * H,
      collected: false,
      bob: Math.random() * Math.PI * 2,
      size: 8
    }));
    
    collectedFireflies = 0;
    totalFireflies = fireflies.length;
    
    gatePos = { x: lvl.gate.x * W, y: lvl.gate.y * H };
    gateAlpha = 0;
    
    // Spawn salamander
    sal.x = lvl.spawn.x * W;
    sal.y = lvl.spawn.y * H;
    sal.vx = 0;
    sal.vy = 0;
    sal.onGround = false;
    sal.direction = 1;
  }

  function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function update(dt) {
    if (state === 'title') return;
    if (state === 'levelComplete' || state === 'gameComplete') {
      transitionTimer -= dt;
      if (transitionTimer <= 0) {
        if (state === 'levelComplete') {
          level++;
          if (level >= LEVELS.length) {
            state = 'gameComplete';
          } else {
            loadLevel(level);
            state = 'playing';
          }
        } else {
          level = 0;
          state = 'title';
        }
      }
      return;
    }

    // Input
    if (keys.left) {
      sal.vx -= MOVE_SPEED * 0.3;
      sal.direction = -1;
    }
    if (keys.right) {
      sal.vx += MOVE_SPEED * 0.3;
      sal.direction = 1;
    }
    if (keys.jump && sal.onGround && !jumpPressed) {
      sal.vy = JUMP_FORCE;
      sal.onGround = false;
      jumpPressed = true;
    }

    // Physics
    sal.vx *= FRICTION;
    sal.vy += GRAVITY;
    
    sal.vx = Math.max(-MOVE_SPEED, Math.min(MOVE_SPEED, sal.vx));
    sal.vy = Math.max(-20, Math.min(15, sal.vy));
    
    sal.x += sal.vx;
    sal.y += sal.vy;

    // Platform collision
    sal.onGround = false;
    for (const p of platforms) {
      // Top collision (landing)
      if (sal.vy > 0 && 
          sal.x + sal.width > p.x && 
          sal.x < p.x + p.w &&
          sal.y + sal.height > p.y && 
          sal.y + sal.height < p.y + p.h + sal.vy + 5) {
        sal.y = p.y - sal.height;
        sal.vy = 0;
        sal.onGround = true;
      }
      // Side collision
      if (sal.y + sal.height > p.y + 5 && sal.y < p.y + p.h) {
        if (sal.vx > 0 && sal.x + sal.width > p.x && sal.x < p.x) {
          sal.x = p.x - sal.width;
          sal.vx = 0;
        } else if (sal.vx < 0 && sal.x < p.x + p.w && sal.x + sal.width > p.x + p.w) {
          sal.x = p.x + p.w;
          sal.vx = 0;
        }
      }
    }

    // Screen bounds
    if (sal.x < 0) sal.x = 0;
    if (sal.x + sal.width > W) sal.x = W - sal.width;
    if (sal.y > H) {
      // Fell off - reset level
      loadLevel(level);
    }

    // Firefly collection
    for (const f of fireflies) {
      if (!f.collected) {
        f.bob += 0.05;
        const dx = (sal.x + sal.width / 2) - f.x;
        const dy = (sal.y + sal.height / 2) - (f.y + Math.sin(f.bob) * 5);
        if (Math.sqrt(dx * dx + dy * dy) < 25) {
          f.collected = true;
          collectedFireflies++;
        }
      }
    }

    // Gate
    if (collectedFireflies >= totalFireflies) {
      gateAlpha = Math.min(1, gateAlpha + 0.02);
    } else {
      gateAlpha = Math.max(0, gateAlpha - 0.01);
    }

    // Gate collision
    if (gateAlpha >= 0.9) {
      const gateW = 50;
      const gateH = 60;
      if (sal.x + sal.width > gatePos.x && 
          sal.x < gatePos.x + gateW &&
          sal.y + sal.height > gatePos.y && 
          sal.y < gatePos.y + gateH) {
        state = 'levelComplete';
        transitionTimer = 1.5;
      }
    }
  }

  function drawBackground() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a1628');
    grad.addColorStop(0.5, '#0d2847');
    grad.addColorStop(1, '#1a4a6e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (const s of stars) {
      s.twinkle += 0.02;
      const alpha = 0.3 + 0.4 * Math.sin(s.twinkle);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // Water reflection
    ctx.fillStyle = 'rgba(13, 40, 71, 0.5)';
    ctx.fillRect(0, H * 0.9, W, H * 0.1);
  }

  function drawPlatform(p) {
    if (p.lily) {
      // Lily pad
      ctx.fillStyle = COLORS.lilyDark;
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w / 2, p.h / 2 + 2, 0, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = COLORS.lily;
      ctx.beginPath();
      ctx.ellipse(p.x + p.w / 2, p.y + p.h / 2, p.w / 2 - 2, p.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Stone platform
      ctx.fillStyle = COLORS.platformDark;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = COLORS.platform;
      ctx.fillRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4);
      ctx.fillStyle = COLORS.platformLight;
      ctx.fillRect(p.x + 4, p.y + 4, p.w - 8, 4);
    }
  }

  function drawSalamander() {
    const cx = sal.x + sal.width / 2;
    const cy = sal.y + sal.height / 2;
    const dir = sal.direction;
    
    ctx.save();
    ctx.translate(cx, cy);
    
    // Body - simple geometric shape
    ctx.fillStyle = COLORS.salamander;
    ctx.beginPath();
    ctx.ellipse(0, 0, sal.width / 2, sal.height / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Tail
    ctx.fillStyle = COLORS.salamanderDark;
    ctx.beginPath();
    ctx.moveTo(-dir * sal.width / 2, 0);
    ctx.lineTo(-dir * sal.width, -3);
    ctx.lineTo(-dir * sal.width, 3);
    ctx.closePath();
    ctx.fill();
    
    // Head bump
    ctx.fillStyle = COLORS.salamander;
    ctx.beginPath();
    ctx.arc(dir * sal.width / 3, -sal.height / 4, 8, 0, Math.PI * 2);
    ctx.fill();
    
    // Simple highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(2, -3, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  }

  function drawFirefly(f) {
    if (f.collected) return;
    
    const y = f.y + Math.sin(f.bob) * 5;
    
    // Glow
    const grd = ctx.createRadialGradient(f.x, y, 0, f.x, y, 20);
    grd.addColorStop(0, 'rgba(255, 214, 10, 0.6)');
    grd.addColorStop(0.5, 'rgba(255, 214, 10, 0.2)');
    grd.addColorStop(1, 'rgba(255, 214, 10, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(f.x, y, 20, 0, Math.PI * 2);
    ctx.fill();
    
    // Core
    ctx.fillStyle = COLORS.firefly;
    ctx.beginPath();
    ctx.arc(f.x, y, f.size, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = COLORS.fireflyGlow;
    ctx.beginPath();
    ctx.arc(f.x - 2, y - 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGate() {
    const x = gatePos.x;
    const y = gatePos.y;
    const gateW = 50;
    const gateH = 60;
    
    if (gateAlpha > 0) {
      // Glow
      const grd = ctx.createRadialGradient(x + gateW / 2, y + gateH / 2, 0, x + gateW / 2, y + gateH / 2, 50);
      grd.addColorStop(0, `rgba(123, 44, 191, ${gateAlpha * 0.5})`);
      grd.addColorStop(1, 'rgba(123, 44, 191, 0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x + gateW / 2, y + gateH / 2, 50, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Frame
    ctx.strokeStyle = `rgba(199, 125, 255, ${gateAlpha})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(x + gateW / 2, y + gateH - 10, gateW / 2 - 5, Math.PI, 0);
    ctx.lineTo(x + gateW - 5, y + gateH);
    ctx.lineTo(x + 5, y + gateH);
    ctx.closePath();
    ctx.stroke();
    
    // Inner glow
    if (gateAlpha > 0.5) {
      ctx.fillStyle = `rgba(199, 125, 255, ${(gateAlpha - 0.5) * 0.5})`;
      ctx.fill();
    }
  }

  function drawUI() {
    // Firefly counter
    const cx = W / 2;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(cx - 60, 15, 120, 30);
    
    ctx.fillStyle = COLORS.firefly;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${collectedFireflies} / ${totalFireflies}`, cx, 37);
    
    // Level indicator
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Level ${level + 1}`, 15, 30);
  }

  function drawTitle() {
    drawBackground();
    
    // Title
    ctx.fillStyle = COLORS.fireflyGlow;
    ctx.font = 'bold 48px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Lily Leap', W / 2, H * 0.3);
    
    // Subtitle
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.font = '18px sans-serif';
    ctx.fillText('Hop to the lotus gate', W / 2, H * 0.38);
    
    // Instructions
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.font = '16px sans-serif';
    ctx.fillText('Arrow keys or WASD to move', W / 2, H * 0.55);
    ctx.fillText('Space or click to jump', W / 2, H * 0.6);
    ctx.fillText('Collect all fireflies to open the gate', W / 2, H * 0.65);
    
    // Start prompt
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
    ctx.fillStyle = `rgba(255, 214, 10, ${pulse})`;
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('Press SPACE or CLICK to start', W / 2, H * 0.8);
  }

  function drawLevelComplete() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = COLORS.fireflyGlow;
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Level Complete!', W / 2, H * 0.45);
  }

  function drawGameComplete() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = COLORS.fireflyGlow;
    ctx.font = 'bold 42px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('You Made It!', W / 2, H * 0.4);
    
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.font = '20px sans-serif';
    ctx.fillText('All lily pads reached safely', W / 2, H * 0.5);
    
    const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 300);
    ctx.fillStyle = `rgba(255, 214, 10, ${pulse})`;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('Press SPACE or CLICK to play again', W / 2, H * 0.7);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    
    if (state === 'title') {
      drawTitle();
      return;
    }
    
    drawBackground();
    
    for (const p of platforms) {
      drawPlatform(p);
    }
    
    drawGate();
    
    for (const f of fireflies) {
      drawFirefly(f);
    }
    
    drawSalamander();
    
    drawUI();
    
    if (state === 'levelComplete') {
      drawLevelComplete();
    } else if (state === 'gameComplete') {
      drawGameComplete();
    }
  }

  function handleStart() {
    if (state === 'title') {
      level = 0;
      loadLevel(level);
      state = 'playing';
    } else if (state === 'gameComplete') {
      level = 0;
      state = 'title';
    }
  }

  // Input handlers
  document.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      keys.jump = true;
      if (state === 'title' || state === 'gameComplete') {
        handleStart();
      }
    }
    e.preventDefault();
  });

  document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      keys.jump = false;
      jumpPressed = false;
    }
  });

  canvas.addEventListener('mousedown', (e) => {
    if (state === 'title' || state === 'gameComplete') {
      handleStart();
      return;
    }
    keys.jump = true;
  });

  canvas.addEventListener('mouseup', () => {
    keys.jump = false;
    jumpPressed = false;
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (state === 'title' || state === 'gameComplete') {
      handleStart();
      return;
    }
    keys.jump = true;
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    keys.jump = false;
    jumpPressed = false;
  }, { passive: false });

  // Game loop
  let lastTime = 0;
  function gameLoop(time) {
    const dt = Math.min((time - lastTime) / 16.67, 2);
    lastTime = time;
    
    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
  }

  // Init
  initStars();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>

<script>
(function () {
  var ENDPOINT = "https://o4512003238199296.ingest.us.sentry.io/api/4512003246194688/envelope/?sentry_key=536c04a3fdaba8575a4e05b9f4f930a0&sentry_version=7";
  var SLUG = "2026-09-06-lily-leap";

  function eventId() {
    var id = '';
    for (var i = 0; i < 32; i += 1) id += Math.floor(Math.random() * 16).toString(16);
    return id;
  }

  function report(value, extra) {
    try {
      var id = eventId();
      // Sentry's envelope format: envelope header, item header, payload,
      // one per line.
      var body =
        JSON.stringify({ event_id: id, sent_at: new Date().toISOString() }) + '\n' +
        JSON.stringify({ type: 'event' }) + '\n' +
        JSON.stringify({
          event_id: id,
          timestamp: Date.now() / 1000,
          platform: 'javascript',
          level: 'error',
          tags: { slug: SLUG },
          exception: { values: [{ type: 'Error', value: String(value).slice(0, 500) }] },
          extra: extra
        });
      // No Content-Type: it keeps the request CORS-simple, so a dying page
      // is not waiting on a preflight. keepalive lets it outlive the frame.
      fetch(ENDPOINT, { method: 'POST', body: body, keepalive: true, mode: 'cors' });
    } catch (e) {}
  }

  window.addEventListener('error', function (event) {
    report(event.message, { source: String(event.filename), line: event.lineno });
  });
  window.addEventListener('unhandledrejection', function (event) {
    report(event.reason, { kind: 'unhandledrejection' });
  });
})();
</script>

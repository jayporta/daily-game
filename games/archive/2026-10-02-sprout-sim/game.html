<!doctype html>
<html lang="en">

<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="UTF-8">
<title>Sprout Sim</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1e3a2a;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let width, height;
  function resize(){
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
  }
  window.addEventListener('resize', resize);
  resize();

  // collector (catcher)
  const collector = {w:60, h:20, x:width/2, y:height-30, speed:5};

  // resources
  let water = 0;
  let sun = 0;

  // droplets
  const droplets = [];
  let lastSpawn = 0;
  const spawnInterval = 800; // ms

  // plant
  const plant = {x:width/2, y:100, level:0, radius:10, maxLevel:5};

  // game state
  let state = 'playing'; // 'playing' or 'won'
  const winMessage = 'Your plant has flourished!';

  // input
  const keys = {};
  window.addEventListener('keydown', e=>{keys[e.key]=true;});
  window.addEventListener('keyup', e=>{keys[e.key]=false;});

  // spawn droplet
  function spawnDroplet(now){
    if(now - lastSpawn < spawnInterval) return;
    lastSpawn = now;
    const type = Math.random()<0.5?'water':'sun';
    const radius = 6;
    const x = Math.random()*(width-2*radius)+radius;
    const y = -radius;
    const speed = 1 + Math.random()*2;
    droplets.push({x,y,radius,type,speed});
  }

  // update
  function update(now){
    spawnDroplet(now);
    // move collector
    if(keys['ArrowLeft']) collector.x -= collector.speed;
    if(keys['ArrowRight']) collector.x += collector.speed;
    // keep collector in bounds
    if(collector.x < collector.w/2) collector.x = collector.w/2;
    if(collector.x > width - collector.w/2) collector.x = width - collector.w/2;

    // update droplets
    for(let i=droplets.length-1;i>=0;i--){
      const d = droplets[i];
      d.y += d.speed;
      // out of screen
      if(d.y > height + d.radius){ droplets.splice(i,1); continue; }
      // collector collision
      if(d.y + d.radius >= collector.y &&
         d.x >= collector.x - collector.w/2 &&
         d.x <= collector.x + collector.w/2){
        if(d.type==='water') water++; else sun++;
        droplets.splice(i,1);
      }
    }

    // grow plant
    if(keys['g'] && state==='playing'){
      if(water>=10 && sun>=10){
        water-=10; sun-=10;
        plant.level++;
        plant.radius += 10;
        if(plant.level>=plant.maxLevel) state='won';
      }
    }
  }

  // draw
  function draw(){
    ctx.clearRect(0,0,width,height);
    // background gradient
    const grad = ctx.createLinearGradient(0,0,0,height);
    grad.addColorStop(0,'#2e7d32');
    grad.addColorStop(1,'#1b5e20');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,width,height);

    // collector
    ctx.fillStyle = '#b0bec5';
    ctx.fillRect(collector.x-collector.w/2, collector.y-collector.h/2, collector.w, collector.h);

    // droplets
    for(const d of droplets){
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.radius, 0, Math.PI*2);
      ctx.fillStyle = d.type==='water'? '#4fc3f7' : '#ffeb3b';
      ctx.fill();
    }

    // plant
    ctx.beginPath();
    ctx.arc(plant.x, plant.y, plant.radius, 0, Math.PI*2);
    ctx.fillStyle = '#66bb6a';
    ctx.fill();
    ctx.strokeStyle = '#2e7d32';
    ctx.lineWidth = 2;
    ctx.stroke();

    // UI
    ctx.fillStyle = '#ffffff';
    ctx.font = '16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Water: ${water}`, 20, 30);
    ctx.fillText(`Sun: ${sun}`, 20, 60);
    ctx.fillText(`Level: ${plant.level}/${plant.maxLevel}`, 20, 90);
    if(state==='won'){
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillRect(0,0,width,height);
      ctx.fillStyle = '#2e7d32';
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(winMessage, width/2, height/2);
    }
  }

  // loop
  function loop(now){
    update(now);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prism Seed</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #05050f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #cfe9ff; touch-action: none;
  }
  #wrap { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="wrap"></canvas>
<script>
"use strict";
(function(){
const canvas = document.getElementById('wrap');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize(){
  W = canvas.width = Math.max(1, canvas.clientWidth);
  H = canvas.height = Math.max(1, canvas.clientHeight);
}
const ro = new ResizeObserver(resize);
ro.observe(canvas);
window.addEventListener('resize', resize);
resize();

const LEVELS = [
  { seeds: 6, targets: [
    {x:.35,y:.45,r:18}, {x:.65,y:.45,r:18}
  ]},
  { seeds: 7, targets: [
    {x:.30,y:.35,r:16}, {x:.50,y:.50,r:16}, {x:.70,y:.35,r:16}
  ]},
  { seeds: 8, targets: [
    {x:.25,y:.40,r:16}, {x:.50,y:.28,r:16}, {x:.75,y:.40,r:16}
  ], walls: [ {x:.40,y:.55,w:.20,h:.06} ]},
  { seeds: 9, targets: [
    {x:.20,y:.35,r:15}, {x:.40,y:.50,r:15}, {x:.60,y:.30,r:15}, {x:.80,y:.45,r:15}
  ]},
  { seeds: 10, targets: [
    {x:.18,y:.40,r:15}, {x:.38,y:.28,r:15}, {x:.50,y:.45,r:15}, {x:.62,y:.32,r:15}, {x:.82,y:.42,r:15}
  ], walls: [ {x:.30,y:.60,w:.15,h:.05}, {x:.60,y:.60,w:.15,h:.05} ]}
];

let levelIndex = 0, level = null, launcher = {x:0,y:0,r:16};
let seeds = [], targets = [], particles = [], motes = [];
let aim = null, seedsLeft = 0, state = 'aiming';

function initLevel(){
  level = LEVELS[levelIndex];
  seedsLeft = level.seeds;
  targets = level.targets.map(t => ({...t, charged:false, pulse:0, rot:Math.random()*6.28}));
  seeds = []; particles = []; aim = null;
  launcher = {x: W/2, y: H - 70, r: 16};
  state = 'aiming';
  motes = [];
  for(let i=0;i<26;i++) motes.push({
    x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+0.4,
    vx:(Math.random()-0.5)*0.18, vy:(Math.random()-0.5)*0.18,
    a:Math.random()*0.5+0.15
  });
}

function spawnHit(x,y,tx,ty){
  const n = 16, a = Math.atan2(ty-y, tx-x);
  for(let i=0;i<n;i++){
    const sp = Math.random()*4.5+1;
    const ang = a + (Math.random()-0.5)*1.7;
    particles.push({x,y,vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      life:42, max:42, c: i%2? '#9fe8ff' : '#eaf6ff'});
  }
}

function rectCircle(rx,ry,rw,rh,cx,cy,cr){
  const nx = Math.max(rx, Math.min(cx, rx+rw));
  const ny = Math.max(ry, Math.min(cy, ry+rh));
  const dx = cx-nx, dy = cy-ny, d2 = dx*dx+dy*dy;
  if(d2 < cr*cr) return {nx,ny,dx,dy,d:Math.sqrt(d2)};
  return null;
}

function preview(vx,vy){
  const pts = []; let x = launcher.x, y = launcher.y, lvy = vy;
  for(let i=0;i<150;i++){
    lvy += 0.35; x += vx; y += lvy;
    if(y > H+40 || x < -40 || x > W+40) break;
    if(level.walls){
      let blocked = false;
      for(const w of level.walls){
        if(rectCircle(w.x*W,w.y*H,w.w*W,w.h*H,x,y,8)){ blocked=true; break; }
      }
      if(blocked) break;
    }
    for(const t of targets){
      if(!t.charged && Math.hypot(x - t.x*W, y - t.y*H) < 8 + t.r){
        pts.push({x,y,hit:true}); return pts;
      }
    }
    if(i % 4 === 0) pts.push({x,y,hit:false});
  }
  return pts;
}

function fire(){
  if(!aim) return;
  const dx = aim.curX - launcher.x, dy = aim.curY - launcher.y;
  const dist = Math.hypot(dx,dy);
  if(dist < 22){ aim = null; return; }
  const power = Math.min(1, dist/140) * 13;
  const ang = Math.atan2(dy, dx);
  seeds.push({x:launcher.x, y:launcher.y, vx:Math.cos(ang)*power, vy:Math.sin(ang)*power, r:8, life:270});
  seedsLeft--; aim = null; state = 'flying';
}

function update(){
  for(const m of motes){
    m.x += m.vx; m.y += m.vy;
    if(m.x < 0) m.x += W; else if(m.x > W) m.x -= W;
    if(m.y < 0) m.y += H; else if(m.y > H) m.y -= H;
  }
  if(state === 'flying'){
    for(const s of seeds){
      s.vy += 0.35; s.x += s.vx; s.y += s.vy; s.life--;
      if(level.walls){
        for(const w of level.walls){
          const r = rectCircle(w.x*W,w.y*H,w.w*W,w.h*H,s.x,s.y,s.r);
          if(r){
            if(r.d > 0.0001){
              const nx = r.dx/r.d, ny = r.dy/r.d;
              s.x += nx * (s.r - r.d);
              s.y += ny * (s.r - r.d);
              const dot = s.vx*nx + s.vy*ny;
              s.vx -= 2*dot*nx; s.vy -= 2*dot*ny;
            }
            s.vx *= 0.9; s.vy *= 0.9;
          }
        }
      }
      for(const t of targets){
        if(!t.charged && Math.hypot(s.x - t.x*W, s.y - t.y*H) < s.r + t.r){
          t.charged = true; t.pulse = 1;
          spawnHit(s.x, s.y, t.x*W, t.y*H);
          s.life = 0;
        }
      }
      if(s.y > H+40 || s.x < -40 || s.x > W+40 || s.life <= 0) s.dead = true;
    }
    seeds = seeds.filter(s => !s.dead);
    if(targets.every(t => t.charged)) state = 'levelwon';
    else if(seedsLeft <= 0 && seeds.length === 0) state = 'gameover';
  }
  for(const p of particles){ p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.97; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for(const t of targets){ if(t.pulse > 0) t.pulse *= 0.88; }
}

function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawTarget(t){
  const x = t.x*W, y = t.y*H, r = t.r, pulse = 1 + t.pulse*0.25;
  ctx.save(); ctx.translate(x,y); ctx.rotate(t.rot);
  ctx.shadowColor = t.charged ? '#fff4d6' : '#6cf0ff';
  ctx.shadowBlur = t.charged ? 32 : 16;
  ctx.beginPath();
  for(let i=0;i<=6;i++){
    const a = i/6*Math.PI*2, rr = r*pulse*(i%2?0.8:1);
    const px = Math.cos(a)*rr, py = Math.sin(a)*rr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  const gr = ctx.createRadialGradient(0,0,0,0,0,r*pulse);
  gr.addColorStop(0, t.charged?'#ffffff':'#bff0ff');
  gr.addColorStop(0.6, t.charged?'#ffd97a':'#5aa0d6');
  gr.addColorStop(1, t.charged?'#ffae3a':'#1f5a8a');
  ctx.fillStyle = gr; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = t.charged?'rgba(255,255,255,0.85)':'rgba(180,220,255,0.45)';
  ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function drawLauncher(){
  const x = launcher.x, y = launcher.y, r = launcher.r;
  let ang = -Math.PI/2;
  if(aim) ang = Math.atan2(aim.curY - y, aim.curX - x);
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.shadowColor = '#7fe0ff'; ctx.shadowBlur = 22;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(-r*0.7, r*0.62); ctx.lineTo(-r*0.7, -r*0.62);
  ctx.closePath();
  const gr = ctx.createRadialGradient(0,0,0,0,0,r);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.5,'#9fe8ff'); gr.addColorStop(1,'rgba(60,140,220,0)');
  ctx.fillStyle = gr; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(180,220,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#0a2a4a';
  ctx.beginPath(); ctx.arc(r*0.35, 0, 2.4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawHUD(){
  ctx.save();
  ctx.fillStyle = 'rgba(180,210,255,0.85)';
  ctx.font = '600 14px -apple-system, Segoe UI, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('Level ' + (levelIndex+1) + ' / ' + LEVELS.length, 16, 16);
  ctx.textAlign = 'right';
  ctx.fillStyle = seedsLeft <= 2 ? '#ffd97a' : 'rgba(180,210,255,0.85)';
  ctx.fillText('Seeds ' + seedsLeft, W-16, 16);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  if(state === 'aiming'){
    ctx.fillStyle = 'rgba(150,180,220,0.45)';
    ctx.font = '500 13px -apple-system, Segoe UI, sans-serif';
    ctx.fillText('Drag from the prism to aim · release to seed', W/2, H-18);
  }
  ctx.restore();
}

function drawOverlay(title, sub){
  ctx.save();
  ctx.fillStyle = 'rgba(5,5,15,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#eaf6ff';
  ctx.font = '700 34px -apple-system, Segoe UI, sans-serif';
  ctx.fillText(title, W/2, H/2 - 16);
  ctx.fillStyle = 'rgba(180,210,255,0.7)';
  ctx.font = '500 15px -apple-system, Segoe UI, sans-serif';
  ctx.fillText(sub, W/2, H/2 + 18);
  ctx.restore();
}

function draw(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#0a0a22'); g.addColorStop(1, '#05050f');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  for(const m of motes){
    ctx.globalAlpha = m.a; ctx.fillStyle = '#9fd6ff';
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(level.walls){
    ctx.save();
    for(const w of level.walls){
      const x=w.x*W, y=w.y*H, ww=w.w*W, wh=w.h*H;
      ctx.shadowColor = '#6cf0ff'; ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(120,200,255,0.18)';
      roundRect(x,y,ww,wh,10); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(150,220,255,0.5)'; ctx.lineWidth = 2;
      roundRect(x,y,ww,wh,10); ctx.stroke();
    }
    ctx.restore();
  }

  for(const t of targets) drawTarget(t);

  for(const s of seeds){
    ctx.save();
    ctx.shadowColor = '#7fe0ff'; ctx.shadowBlur = 16;
    const gr = ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2);
    gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.4,'#9fe8ff'); gr.addColorStop(1,'rgba(80,180,255,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    ctx.restore();
  }

  for(const p of particles){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if(aim && state === 'aiming'){
    const pts = preview(aim.curX - launcher.x, aim.curY - launcher.y);
    for(let i=0;i<pts.length;i++){
      const p = pts[i];
      ctx.globalAlpha = 0.2 + 0.55*(i/Math.max(1,pts.length-1));
      ctx.fillStyle = p.hit ? '#ffcf6c' : '#9fd6ff';
      ctx.beginPath(); ctx.arc(p.x,p.y, p.hit?5:2.5, 0,7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(150,210,255,0.35)';
    ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(launcher.x, launcher.y); ctx.lineTo(aim.curX, aim.curY); ctx.stroke();
    ctx.setLineDash([]);
  }

  drawLauncher();
  drawHUD();

  if(state === 'levelwon') drawOverlay('Level ' + (levelIndex+1) + ' cleared', 'Tap to continue');
  else if(state === 'gameover') drawOverlay('Out of seeds', 'Tap to retry');
  else if(state === 'complete') drawOverlay('Cavern charged', 'Tap to replay');
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }

function pos(e){
  const r = canvas.getBoundingClientRect();
  if(e.touches && e.touches[0]) return {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top};
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}

canvas.addEventListener('mousedown', e=>{
  if(state !== 'aiming') return;
  const p = pos(e);
  aim = {startX: launcher.x, startY: launcher.y, curX: p.x, curY: p.y};
});
canvas.addEventListener('mousemove', e=>{
  if(!aim) return;
  const p = pos(e); aim.curX = p.x; aim.curY = p.y;
});
window.addEventListener('mouseup', e=>{ if(aim) fire(); });

canvas.addEventListener('touchstart', e=>{ e.preventDefault(); if(state !== 'aiming') return; const p = pos(e); aim = {startX: launcher.x, startY: launcher.y, curX: p.x, curY: p.y}; }, {passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); if(!aim) return; const p = pos(e); aim.curX = p.x; aim.curY = p.y; }, {passive:false});
canvas.addEventListener('touchend', e=>{ e.preventDefault(); if(aim) fire(); }, {passive:false});

canvas.addEventListener('click', e=>{
  if(state === 'levelwon'){ levelIndex++; if(levelIndex >= LEVELS.length) state = 'complete'; else initLevel(); }
  else if(state === 'gameover'){ initLevel(); }
  else if(state === 'complete'){ levelIndex = 0; initLevel(); }
});

initLevel();
loop();
})();
</script>
</body>
</html>

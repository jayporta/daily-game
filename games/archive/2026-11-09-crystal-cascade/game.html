<!doctype html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src https://o4512003238199296.ingest.us.sentry.io">
<meta charset="utf-8">
<title>Crystal Cascade</title>
<style>
  body {
    margin:0;
    width:100vw;
    height:100vh;
    background:#1a1a2e;
    color:#fff;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .info {
    margin-bottom:20px;
    font-size:1.2em;
    text-align:center;
  }
  #target {
    display:inline-grid;
    grid-gap:4px;
    margin:10px auto;
  }
  #grid {
    display:grid;
    grid-gap:4px;
    margin:auto;
  }
  .tile {
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    cursor:pointer;
    transition:transform 0.2s;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
    position:relative;
  }
  .tile.selected {
    outline:3px solid #ffeb3b;
  }
  .shape.circle {
    border-radius:50%;
  }
  .shape.square {
    border-radius:12px;
  }
  .shape.triangle {
    background:transparent;
  }
  .shape.triangle svg {
    width:100%;
    height:100%;
  }
  .shape.triangle svg path {
    fill:currentColor;
  }
  .target .tile {
    width:40px;
    height:40px;
    font-size:1.2em;
  }
  button {
    margin-top:20px;
    padding:10px 20px;
    font-size:1em;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="info">
  <div>Level: <span id="level">1</span></div>
  <div>Moves left: <span id="moves">20</span></div>
</div>
<div id="target" class="target"></div>
<div id="grid" class="grid"></div>
<button id="restart" style="display:none;">Restart Level</button>

<script>
  const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD'];
  const shapes = ['circle','square','triangle'];

  const levels = [
    {
      target: [['circle','square'],['triangle','circle']],
      board: [['triangle','circle'],['square','triangle']]
    },
    {
      target: [['circle','square','triangle'],['square','triangle','circle'],['triangle','circle','square']],
      board: [['triangle','circle','square'],['square','triangle','circle'],['circle','square','triangle']]
    },
    {
      target: [
        ['circle','circle','circle'],
        ['circle','circle','circle'],
        ['circle','circle','circle']
      ],
      board: [
        ['square','circle','circle'],
        ['circle','circle','circle'],
        ['circle','circle','circle']
      ]
    }
  ];

  let currentLevel = 0;
  let board, target;
  let movesLeft = 20;
  let selectedRow = -1, selectedCol = -1;
  let gridEl, targetEl, movesEl, levelEl, restartBtn;

  function createTile(shape, color, isTarget = false) {
    const tile = document.createElement('div');
    tile.className = `tile shape-${shape}`;
    if (shape === 'circle' || shape === 'square') {
      tile.style.backgroundColor = color;
    } else if (shape === 'triangle') {
      tile.innerHTML = `<svg viewBox="0 0 60 60"><path d="M30 10 L10 50 L50 50 Z" fill="${color}"/></svg>`;
      tile.style.display = 'flex';
      tile.style.alignItems = 'center';
      tile.style.justifyContent = 'center';
      tile.style.color = color;
    }
    if (isTarget) tile.style.opacity = '0.7';
    return tile;
  }

  function renderBoard() {
    gridEl.innerHTML = '';
    for (let r = 0; r < board.length; r++) {
      for (let c = 0; c < board[r].length; c++) {
        const tile = createTile(board[r][c], colors[Math.floor(Math.random() * colors.length)]);
        tile.dataset.r = r;
        tile.dataset.c = c;
        if (r === selectedRow && c === selectedCol) tile.classList.add('selected');
        gridEl.appendChild(tile);
      }
    }
  }

  function renderTarget() {
    targetEl.innerHTML = '';
    for (let r = 0; r < target.length; r++) {
      for (let c = 0; c < target[r].length; c++) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const tile = createTile(target[r][c], color, true);
        targetEl.appendChild(tile);
      }
    }
  }

  function checkWin() {
    for (let r = 0; r < board.length; r++) {
      for (let c = 0; c < board[r].length; c++) {
        if (board[r][c] !== target[r][c]) return false;
      }
    }
    return true;
  }

  function swapTiles(r1, c1, r2, c2) {
    const tmp = board[r1][c1];
    board[r1][c1] = board[r2][c2];
    board[r2][c2] = tmp;
    movesLeft--;
    movesEl.textContent = movesLeft;
    selectedRow = -1;
    selectedCol = -1;
    renderBoard();
    if (checkWin()) {
      alert(`Level ${currentLevel + 1} Complete!`);
      if (currentLevel < levels.length - 1) {
        currentLevel++;
        startLevel();
      } else {
        alert('All levels completed!');
        restartBtn.style.display = 'inline';
      }
    }
    if (movesLeft <= 0 && !checkWin()) {
      alert('Out of moves! Restart?');
      restartBtn.style.display = 'inline';
    }
  }

  function startLevel() {
    const lvl = levels[currentLevel];
    target = lvl.target;
    board = lvl.board.map(row => [...row]);
    movesLeft = 20;
    selectedRow = -1;
    selectedCol = -1;
    renderTarget();
    renderBoard();
    movesEl.textContent = movesLeft;
    levelEl.textContent = currentLevel + 1;
    restartBtn.style.display = 'none';
  }

  function handleKey(e) {
    if (e.key === 'ArrowUp') {
      if (selectedRow > 0) { selectedRow--; renderBoard(); }
    } else if (e.key === 'ArrowDown') {
      if (selectedRow < board.length - 1) { selectedRow++; renderBoard(); }
    } else if (e.key === 'ArrowLeft') {
      if (selectedCol > 0) { selectedCol--; renderBoard(); }
    } else if (e.key === 'ArrowRight') {
      if (selectedCol < board[0].length - 1) { selectedCol++; renderBoard(); }
    } else if (e.key === ' ') {
      if (selectedRow >= 0 && selectedCol >= 0) {
        const r = selectedRow, c = selectedCol;
        if (r < board.length - 1) swapTiles(r, c, r + 1, c);
        else if (c < board[0].length - 1) swapTiles(r, c, r, c + 1);
        else if (r > 0) swapTiles(r, c, r - 1, c);
        else if (c > 0) swapTiles(r, c, r, c - 1);
      }
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    gridEl = document.getElementById('grid');
    targetEl = document.getElementById('target');
    movesEl = document.getElementById('moves');
    levelEl = document.getElementById('level');
    restartBtn = document.getElementById('restart');
    restartBtn.addEventListener('click', startLevel);
    window.addEventListener('keydown', handleKey);
    startLevel();
  });
</script>
</body>
</html>
